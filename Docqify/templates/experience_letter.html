<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Work Experience Letter Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- General & Layout Styles --- */
        :root {
            --primary-color: #003366; /* A deep, corporate navy blue */
            --secondary-color: #343a40;
            --background-color: #f0f2f5;
            --editor-bg: #ffffff;
            --preview-bg: #f8f9fa;
            --border-color: #dee2e6;
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background-color);
        }
        .overleaf-container { display: flex; height: 100vh; }
        .editor-pane, .preview-pane {
            height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        .editor-pane { flex: 1; background-color: var(--editor-bg); border-right: 1px solid var(--border-color); }
        .preview-pane { flex: 1.2; background-color: var(--preview-bg); }
        .preview-controls {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
        }

        /* --- Form Styles --- */
        #expForm { max-width: 600px; margin: auto; }
        #expForm h1 { color: var(--primary-color); text-align: center; }
        #expForm fieldset { border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        #expForm legend { font-size: 1.3em; font-weight: 600; color: var(--primary-color); padding: 0 10px; }
        input[type="text"], input[type="date"], textarea {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border-color);
            border-radius: 5px; box-sizing: border-box; font-family: inherit; font-size: 1rem;
        }
        .ai-button, .download-button { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 1em; }
        .ai-button { background-color: #ffc107; color: #333; display: block; width: 100%; margin-top: 10px; }
        .download-button { background-color: #28a745; color: white; }

        /* --- Theme Switch Styles --- */
        .theme-switch-wrapper { display: flex; align-items: center; gap: 10px; }
        .theme-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .theme-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* --- Loader Styles --- */
        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid var(--primary-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- Experience Letter PREVIEW STYLES --- */
        /* BASE (SIMPLE) THEME */
        #exp-output-container {
            max-width: 8.5in; min-height: 11in; margin: 0 auto; background: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.1); padding: 1in; box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 12pt; line-height: 1.6;
            transition: all 0.3s ease;
        }
        .exp-header { text-align: center; margin-bottom: 50px; }
        .exp-header .company-name { font-size: 1.8em; font-weight: bold; }
        .exp-header .company-address { font-size: 0.9em; color: #555; }
        .exp-subject { font-weight: bold; margin-top: 20px; margin-bottom: 20px; text-align: center; text-transform: uppercase; }
        .exp-body p { margin-bottom: 1.2em; text-align: justify;}
        .exp-signature-block { margin-top: 50px; }

        /* MODERN THEME OVERRIDES */
        #exp-output-container.modern-theme {
            font-family: 'Lato', -apple-system, sans-serif;
            font-size: 11pt;
        }
        .modern-theme .exp-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            text-align: left; border-bottom: 2px solid var(--primary-color); padding-bottom: 20px;
        }
        .modern-theme .exp-header .logo-placeholder { font-size: 2em; font-weight: bold; color: var(--primary-color); }
        .modern-theme .exp-subject { text-align: left; }
    </style>
</head>
<body>

    <div class="overleaf-container">
        <!-- Editor Pane -->
        <div class="editor-pane">
            <form id="expForm">
                <h1>Work Experience Letter</h1>
                <fieldset>
                    <legend>Company & Issuer Details</legend>
                    <input type="text" id="companyName" placeholder="Company Name">
                    <input type="text" id="companyAddress" placeholder="Company Address">
                    <input type="text" id="issuerName" placeholder="Your Name (Manager/HR)">
                    <input type="text" id="issuerTitle" placeholder="Your Title">
                </fieldset>
                <fieldset>
                    <legend>Employee Details</legend>
                    <input type="text" id="employeeName" placeholder="Employee's Full Name">
                    <label for="employmentStartDate">Employment Start Date (Required)</label>
                    <input type="date" id="employmentStartDate">
                    <label for="employmentEndDate">Employment End Date (Required)</label>
                    <input type="date" id="employmentEndDate">
                    <input type="text" id="jobTitle" placeholder="Last Held Job Title">
                </fieldset>
                <fieldset>
                    <legend>Job Responsibilities (Optional)</legend>
                    <textarea id="jobResponsibilities" rows="5" placeholder="Briefly list the employee's main duties or a short description of their role."></textarea>
                </fieldset>
                <fieldset>
                    <legend>Generate & Refine</legend>
                    <button type="button" class="ai-button" onclick="generateLetter()">✨ Assemble Letter</button>
                    <textarea id="letterBody" rows="15" placeholder="The assembled letter body will appear here. Review for factual accuracy." style="margin-top: 15px;"></textarea>
                </fieldset>
            </form>
        </div>

        <!-- Preview Pane -->
        <div class="preview-pane">
            <div class="preview-controls">
                <h2>Live Preview</h2>
                <div class="theme-switch-wrapper">
                    <span>Simple</span>
                    <label class="theme-switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider"></span>
                    </label>
                    <span>Modern</span>
                </div>
                <button type="button" class="download-button" id="downloadPdfBtn">Download PDF</button>
            </div>
            <div id="exp-output-container">
                <p style="text-align: center; color: #888; margin-top: 2in;">Your Experience Letter will appear here.</p>
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div class="loader-overlay" id="loader"><div class="loader"></div></div>

    <!-- Hidden styles for PDF -->
    <style id="exp-styles-for-pdf">
        body { font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 12pt; line-height: 1.6; }
        .exp-header { text-align: center; margin-bottom: 50px; }
        .exp-header .company-name { font-size: 1.8em; font-weight: bold; }
        .exp-header .company-address { font-size: 0.9em; color: #555; }
        .exp-subject { font-weight: bold; margin-top: 20px; margin-bottom: 20px; text-align: center; text-transform: uppercase; }
        .exp-body p { margin-bottom: 1.2em; text-align: justify;}
        .exp-signature-block { margin-top: 50px; }
        .modern-theme { font-family: 'Lato', -apple-system, sans-serif; font-size: 11pt; }
        .modern-theme .exp-header { display: flex; justify-content: space-between; align-items: flex-start; text-align: left; border-bottom: 2px solid #003366; padding-bottom: 20px; }
        .modern-theme .exp-header .logo-placeholder { font-size: 2em; font-weight: bold; color: #003366; }
        .modern-theme .exp-subject { text-align: left; }
    </style>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="{{ url_for('static', filename='js/download-payment.js') }}"></script>
    <script>
        const loader = document.getElementById('loader');
        const form = document.getElementById('expForm');
        const downloadBtn = document.getElementById('downloadPdfBtn');
        const letterBodyTextarea = document.getElementById('letterBody');
        const previewContainer = document.getElementById('exp-output-container');
        const themeToggle = document.getElementById('theme-toggle');

        async function fetchAIContent(prompt) { /* ... (same as previous) ... */ }

        async function generateLetter() {
            const data = {
                employeeName: document.getElementById('employeeName').value,
                startDate: document.getElementById('employmentStartDate').value,
                endDate: document.getElementById('employmentEndDate').value,
                jobTitle: document.getElementById('jobTitle').value,
                responsibilities: document.getElementById('jobResponsibilities').value,
                companyName: document.getElementById('companyName').value,
            };

            if (!data.employeeName || !data.startDate || !data.endDate || !data.jobTitle) {
                alert("Please fill in all required Employee Details fields.");
                return;
            }

            const prompt = `
                You are a professional HR Manager. Assemble a formal and factual work experience letter.

                **Data:**
                - Employee Name: ${data.employeeName}
                - Employment Period: From ${data.startDate} to ${data.endDate}
                - Last Held Position: ${data.jobTitle}
                - Company: ${data.companyName}
                - Summary of Responsibilities: ${data.responsibilities || 'Not specified.'}

                **Instructions:**
                1.  **Opening:** Start with a formal statement confirming the employment details. For example: "This is to certify that [Employee Name] was employed with [Company Name] from [Start Date] to [End Date]."
                2.  **Role Confirmation:** State the employee's last held position.
                3.  **Responsibilities (If provided):** If responsibilities are listed, add a sentence like "During their tenure, their primary responsibilities included..." and then list them briefly.
                4.  **Closing:** End with a simple, neutral closing statement, such as "We wish them all the best in their future endeavors."
                5.  **Tone:** Strictly formal, official, and factual. Avoid emotional language or strong recommendations.
                6.  **IMPORTANT:** Generate ONLY the main body of the letter. Do not include headers, subjects, salutations, or signatures.
            `;

            const result = await fetchAIContent(prompt);
            if (result) {
                letterBodyTextarea.value = result;
                updatePreview();
            }
        }

        function updatePreview() {
            const isModern = themeToggle.checked;
            previewContainer.classList.toggle('modern-theme', isModern);

            const data = {
                companyName: document.getElementById('companyName').value,
                companyAddress: document.getElementById('companyAddress').value,
                issuerName: document.getElementById('issuerName').value || 'HR Manager',
                issuerTitle: document.getElementById('issuerTitle').value || 'Human Resources',
                letterBody: letterBodyTextarea.value,
            };

            const today = new Date();
            const dateString = today.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            const bodyWithParagraphs = data.letterBody.split('\n').filter(p => p.trim() !== '').map(p => `<p>${p.trim()}</p>`).join('');

            let html = `
                <div class="exp-header">
                    ${isModern ? `<div class="logo-placeholder">${data.companyName.split(' ')[0] || 'Company'}</div>` : `<div class="company-name">${data.companyName || 'Company Name'}</div><div class="company-address">${data.companyAddress}</div>`}
                </div>
                <div class="exp-date" style="text-align: right;">Date: ${dateString}</div>
                <div class="exp-subject">To Whom It May Concern</div>
                <div class="exp-body">${bodyWithParagraphs || '<p>[Letter content will be assembled here...]</p>'}</div>
                <div class="exp-signature-block">
                    <p>Sincerely,</p><br><br>
                    <p>_________________________</p>
                    <p><strong>${data.issuerName}</strong></p>
                    <p>${data.issuerTitle}</p>
                    <p>${data.companyName}</p>
                </div>
            `;

            previewContainer.innerHTML = html;
        }

        async function downloadPDF() { /* ... (same as previous, with updated filename logic) ... */ }

        // Re-pasting full functions for completeness
        async function fetchAIContent(prompt) {
            loader.style.display = 'flex';
            try {
                const response = await fetch('/generate_ai_content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                if (!response.ok) { const error = await response.json(); throw new Error(error.error || `HTTP error! status: ${response.status}`); }
                const data = await response.json();
                return data.text;
            } catch (error) {
                console.error("Error fetching AI content:", error);
                alert(`AI Generation Failed: ${error.message}`);
                return null;
            } finally {
                loader.style.display = 'none';
            }
        }
        async function downloadPDF() {
            const employeeName = document.getElementById('employeeName').value;
            if (!employeeName || !letterBodyTextarea.value) {
                alert('Please provide the employee\'s name and assemble the letter before downloading.');
                return;
            }
            loader.style.display = 'flex';
            const contentToPrint = previewContainer.innerHTML;
            const styles = document.getElementById('exp-styles-for-pdf').innerHTML;
            const isModern = themeToggle.checked;
            const containerClass = isModern ? 'modern-theme' : '';
            const fullHtmlContent = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Experience Letter</title><link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet"><style>${styles}</style></head><body class="${containerClass}">${contentToPrint}</body></html>`;
            try {
                const response = await fetch('/download_pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ html_content: fullHtmlContent })
                });
                if (!response.ok) throw new Error(`PDF generation failed: ${response.statusText}`);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                const safeName = employeeName.replace(/[^a-z0-9]/gi, '_').replace(/_+/g, '_');
                a.download = `Experience_Letter_for_${safeName || 'employee'}.pdf`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
            } catch (error) {
                console.error('Error downloading PDF:', error);
                alert(error.message || 'Could not download PDF. See console for details.');
            } finally {
                loader.style.display = 'none';
            }
        }

        // --- Event Listeners ---
        form.addEventListener('input', updatePreview);
        themeToggle.addEventListener('change', updatePreview);
        downloadBtn.addEventListener('click', downloadPDF);

        // --- Initial Load ---
        updatePreview();
    </script>
</body>
</html>
