<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Employment Contract Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2e7d32;
            --secondary-color: #333;
            --background-color: #f0f2f5;
            --editor-bg: #ffffff;
            --preview-bg: #fafafa;
            --border-color: #d9d9d9;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: var(--background-color); }
        .overleaf-container { display: flex; height: 100vh; }
        .editor-pane, .preview-pane { height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .editor-pane { flex: 1; background-color: var(--editor-bg); border-right: 1px solid var(--border-color); }
        .preview-pane { flex: 1.2; background-color: var(--preview-bg); }
        .preview-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        #contractForm { max-width: 600px; margin: auto; }
        #contractForm h1 { color: var(--primary-color); text-align: center; }
        #contractForm fieldset { border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        #contractForm legend { font-size: 1.3em; font-weight: 600; color: var(--primary-color); padding: 0 10px; }
        input[type="text"], input[type="date"], input[type="number"], select, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border-color); border-radius: 5px; box-sizing: border-box; font-family: inherit; font-size: 1rem; }
        .ai-button, .download-button { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 1em; }
        .ai-button { background-color: #ffc107; color: #333; display: block; width: 100%; margin-top: 10px; }
        .download-button { background-color: #28a745; color: white; }
        .theme-switch-wrapper { display: flex; align-items: center; gap: 10px; }
        .theme-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .theme-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(24px); }
        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid var(--primary-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #contract-output-container {
            max-width: 8.5in; min-height: 11in; margin: 0 auto; background: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.1); padding: 1in; box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 11pt; line-height: 1.6;
            transition: all 0.3s ease;
        }
        .contract-title { text-align: center; font-size: 1.5em; font-weight: bold; margin-bottom: 30px; text-transform: uppercase; border-bottom: 2px solid #2e7d32; padding-bottom: 10px; }
        .contract-parties { margin-bottom: 25px; }
        .contract-body { text-align: justify; }
        .contract-body p { margin-bottom: 1em; }
        .contract-body h3 { margin-top: 20px; margin-bottom: 10px; color: #2e7d32; }
        .contract-signatures { margin-top: 50px; display: flex; justify-content: space-between; }
        .contract-sig-block { width: 45%; }
        .contract-sig-block .sig-line { border-top: 1px solid #333; margin-top: 50px; padding-top: 5px; }

        #contract-output-container.modern-theme { font-family: 'Lato', -apple-system, sans-serif; }
        .modern-theme .contract-title { color: #2e7d32; border-bottom: 3px solid #2e7d32; }
        .modern-theme .contract-body h3 { color: #2e7d32; border-left: 3px solid #2e7d32; padding-left: 10px; }
    </style>
</head>
<body>
    <div class="overleaf-container">
        <div class="editor-pane">
            <form id="contractForm">
                <h1>Employment Contract Generator</h1>
                <fieldset>
                    <legend>1. Employer Details</legend>
                    <input type="text" id="companyName" placeholder="Company/Organization Name">
                    <input type="text" id="companyAddress" placeholder="Company Address">
                    <input type="text" id="authorizedPerson" placeholder="Authorized Signatory Name">
                    <input type="text" id="authorizedTitle" placeholder="Signatory Designation (e.g., HR Director)">
                </fieldset>
                <fieldset>
                    <legend>2. Employee Details</legend>
                    <input type="text" id="employeeName" placeholder="Employee Full Name">
                    <input type="text" id="employeeAddress" placeholder="Employee Address">
                    <input type="text" id="designation" placeholder="Job Title / Designation">
                    <input type="text" id="department" placeholder="Department">
                </fieldset>
                <fieldset>
                    <legend>3. Employment Terms</legend>
                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate">
                    <select id="employmentType">
                        <option value="Full-time">Full-time</option>
                        <option value="Part-time">Part-time</option>
                        <option value="Contract">Contract / Fixed-term</option>
                        <option value="Probationary">Probationary</option>
                    </select>
                    <input type="text" id="salary" placeholder="Annual Salary / CTC (e.g., $60,000 per annum)">
                    <input type="text" id="workingHours" placeholder="Working Hours (e.g., 9 AM to 6 PM, Monday to Friday)">
                    <input type="text" id="probationPeriod" placeholder="Probation Period (e.g., 3 months)">
                    <input type="text" id="noticePeriod" placeholder="Notice Period (e.g., 30 days)">
                </fieldset>
                <fieldset>
                    <legend>4. Additional Terms</legend>
                    <textarea id="benefits" rows="3" placeholder="Benefits: health insurance, PTO, retirement plan..."></textarea>
                    <textarea id="additionalClauses" rows="3" placeholder="Optional: Non-compete, confidentiality, special conditions..."></textarea>
                </fieldset>
                <fieldset>
                    <legend>5. Generate & Refine</legend>
                    <button type="button" class="ai-button" onclick="generateContract()">✨ Generate Employment Contract</button>
                    <textarea id="contractBody" rows="20" placeholder="The AI-generated contract will appear here. Review carefully." style="margin-top: 15px;"></textarea>
                </fieldset>
            </form>
        </div>
        <div class="preview-pane">
            <div class="preview-controls">
                <h2>Live Preview</h2>
                <div class="theme-switch-wrapper">
                    <span>Classic</span>
                    <label class="theme-switch"><input type="checkbox" id="theme-toggle"><span class="slider"></span></label>
                    <span>Modern</span>
                </div>
                <button type="button" class="download-button" id="downloadPdfBtn">Download PDF</button>
            </div>
            <div id="contract-output-container">
                <p style="text-align: center; color: #888; margin-top: 2in;">Your Employment Contract will appear here.</p>
            </div>
        </div>
    </div>
    <div class="loader-overlay" id="loader"><div class="loader"></div></div>
    <style id="contract-styles-for-pdf">
        body { font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 11pt; line-height: 1.6; }
        .contract-title { text-align: center; font-size: 1.5em; font-weight: bold; margin-bottom: 30px; text-transform: uppercase; border-bottom: 2px solid #2e7d32; padding-bottom: 10px; }
        .contract-parties { margin-bottom: 25px; }
        .contract-body { text-align: justify; }
        .contract-body p { margin-bottom: 1em; }
        .contract-body h3 { margin-top: 20px; margin-bottom: 10px; color: #2e7d32; }
        .contract-signatures { margin-top: 50px; display: flex; justify-content: space-between; }
        .contract-sig-block { width: 45%; }
        .contract-sig-block .sig-line { border-top: 1px solid #333; margin-top: 50px; padding-top: 5px; }
        .modern-theme { font-family: 'Lato', -apple-system, sans-serif; }
        .modern-theme .contract-title { color: #2e7d32; border-bottom: 3px solid #2e7d32; }
        .modern-theme .contract-body h3 { color: #2e7d32; border-left: 3px solid #2e7d32; padding-left: 10px; }
    </style>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="{{ url_for('static', filename='js/download-payment.js') }}"></script>
    <script>
        const loader = document.getElementById('loader');
        const form = document.getElementById('contractForm');
        const downloadBtn = document.getElementById('downloadPdfBtn');
        const contractBodyTextarea = document.getElementById('contractBody');
        const previewContainer = document.getElementById('contract-output-container');
        const themeToggle = document.getElementById('theme-toggle');

        async function fetchAIContent(prompt) {
            loader.style.display = 'flex';
            try {
                const response = await fetch('/generate_ai_content', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
                if (!response.ok) { const error = await response.json(); throw new Error(error.error || `HTTP error! status: ${response.status}`); }
                const data = await response.json(); return data.text;
            } catch (error) { console.error("Error:", error); alert(`AI Generation Failed: ${error.message}`); return null; }
            finally { loader.style.display = 'none'; }
        }

        async function generateContract() {
            const data = {
                companyName: document.getElementById('companyName').value,
                employeeName: document.getElementById('employeeName').value,
                designation: document.getElementById('designation').value,
                department: document.getElementById('department').value,
                startDate: document.getElementById('startDate').value,
                employmentType: document.getElementById('employmentType').value,
                salary: document.getElementById('salary').value,
                workingHours: document.getElementById('workingHours').value,
                probationPeriod: document.getElementById('probationPeriod').value,
                noticePeriod: document.getElementById('noticePeriod').value,
                benefits: document.getElementById('benefits').value,
                additionalClauses: document.getElementById('additionalClauses').value,
            };
            if (!data.companyName || !data.employeeName || !data.designation || !data.salary) {
                alert("Please fill in Company Name, Employee Name, Designation, and Salary."); return;
            }
            const prompt = `Generate a comprehensive employment contract document. Use section headings with "Section X:" format.

Employer: ${data.companyName}. Employee: ${data.employeeName}. Position: ${data.designation}, Dept: ${data.department}. Start Date: ${data.startDate}. Type: ${data.employmentType}. Salary: ${data.salary}. Working Hours: ${data.workingHours || 'Standard business hours'}. Probation: ${data.probationPeriod || '3 months'}. Notice Period: ${data.noticePeriod || '30 days'}. Benefits: ${data.benefits || 'As per company policy'}. Additional clauses: ${data.additionalClauses || 'Standard terms apply'}.

Include these sections: 1. Position & Duties, 2. Compensation & Benefits, 3. Working Hours, 4. Probation Period, 5. Leave Policy, 6. Confidentiality, 7. Termination & Notice Period, 8. General Provisions. Format each section heading as "Section X: Title" on its own line, followed by the content. Generate ONLY the contract clauses - no title, parties intro, or signature blocks.`;
            const result = await fetchAIContent(prompt);
            if (result) { contractBodyTextarea.value = result; updatePreview(); }
        }

        function updatePreview() {
            const isModern = themeToggle.checked;
            previewContainer.classList.toggle('modern-theme', isModern);
            const data = {
                companyName: document.getElementById('companyName').value || 'Company Name',
                companyAddress: document.getElementById('companyAddress').value || 'Company Address',
                employeeName: document.getElementById('employeeName').value || 'Employee Name',
                employeeAddress: document.getElementById('employeeAddress').value || 'Employee Address',
                authorizedPerson: document.getElementById('authorizedPerson').value || 'Authorized Signatory',
                authorizedTitle: document.getElementById('authorizedTitle').value || 'HR Director',
                contractBody: contractBodyTextarea.value,
            };
            const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            let bodyHtml = '';
            if (data.contractBody) {
                const lines = data.contractBody.split('\n').filter(l => l.trim());
                bodyHtml = lines.map(line => {
                    if (/^(Section\s+\d+|Article\s+\d+|Clause\s+\d+)/i.test(line.trim())) {
                        return `<h3>${line.trim()}</h3>`;
                    }
                    return `<p>${line.trim()}</p>`;
                }).join('');
            }
            previewContainer.innerHTML = `
                <div class="contract-title">Employment Contract</div>
                <div class="contract-parties">
                    <p>This Employment Contract ("Agreement") is entered into on <strong>${today}</strong> between:</p>
                    <p><strong>Employer:</strong> ${data.companyName}, located at ${data.companyAddress}</p>
                    <p><strong>Employee:</strong> ${data.employeeName}, residing at ${data.employeeAddress}</p>
                </div>
                <div class="contract-body">${bodyHtml || '<p>[Contract terms will appear here...]</p>'}</div>
                <div class="contract-signatures">
                    <div class="contract-sig-block"><div class="sig-line"><strong>Employer</strong><br>${data.authorizedPerson}<br>${data.authorizedTitle}<br>${data.companyName}</div></div>
                    <div class="contract-sig-block"><div class="sig-line"><strong>Employee</strong><br>${data.employeeName}</div></div>
                </div>`;
        }

        async function downloadPDF() {
            const name = document.getElementById('employeeName').value;
            if (!name || !contractBodyTextarea.value) { alert('Please provide employee name and generate the contract first.'); return; }
            loader.style.display = 'flex';
            const styles = document.getElementById('contract-styles-for-pdf').innerHTML;
            const containerClass = themeToggle.checked ? 'modern-theme' : '';
            const fullHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Employment Contract</title><link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet"><style>${styles}</style></head><body class="${containerClass}">${previewContainer.innerHTML}</body></html>`;
            try {
                const response = await fetch('/download_pdf', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ html_content: fullHtml }) });
                if (!response.ok) throw new Error('PDF generation failed');
                const blob = await response.blob(); const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); a.style.display = 'none'; a.href = url;
                a.download = `Employment_Contract_${name.replace(/[^a-z0-9]/gi, '_')}.pdf`;
                document.body.appendChild(a); a.click(); window.URL.revokeObjectURL(url); a.remove();
            } catch (e) { console.error(e); alert(e.message || 'Could not download PDF.'); }
            finally { loader.style.display = 'none'; }
        }

        form.addEventListener('input', updatePreview);
        themeToggle.addEventListener('change', updatePreview);
        downloadBtn.addEventListener('click', downloadPDF);
        updatePreview();
    </script>
</body>
</html>
