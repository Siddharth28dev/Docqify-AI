<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Government Proposal Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1B5E20;
            --secondary-color: #333;
            --background-color: #f0f2f5;
            --editor-bg: #ffffff;
            --preview-bg: #fafafa;
            --border-color: #d9d9d9;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: var(--background-color); }
        .overleaf-container { display: flex; height: 100vh; }
        .editor-pane, .preview-pane { height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .editor-pane { flex: 1; background-color: var(--editor-bg); border-right: 1px solid var(--border-color); }
        .preview-pane { flex: 1.2; background-color: var(--preview-bg); }
        .preview-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        #proposalForm { max-width: 600px; margin: auto; }
        #proposalForm h1 { color: var(--primary-color); text-align: center; }
        #proposalForm fieldset { border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        #proposalForm legend { font-size: 1.3em; font-weight: 600; color: var(--primary-color); padding: 0 10px; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border-color); border-radius: 5px; box-sizing: border-box; font-family: inherit; font-size: 1rem; }
        .ai-button, .download-button { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 1em; }
        .ai-button { background-color: #ffc107; color: #333; display: block; width: 100%; margin-top: 10px; }
        .download-button { background-color: #28a745; color: white; }
        .theme-switch-wrapper { display: flex; align-items: center; gap: 10px; }
        .theme-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .theme-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(24px); }
        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid var(--primary-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #proposal-output-container {
            max-width: 8.5in; min-height: 11in; margin: 0 auto; background: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.1); padding: 1in; box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 12pt; line-height: 1.7;
            transition: all 0.3s ease;
        }
        .prop-title { text-align: center; font-size: 1.4em; font-weight: bold; margin-bottom: 5px; color: #1B5E20; text-transform: uppercase; }
        .prop-subtitle { text-align: center; font-size: 1em; color: #555; margin-bottom: 30px; border-bottom: 2px solid #1B5E20; padding-bottom: 15px; }
        .prop-meta { margin-bottom: 25px; }
        .prop-meta-item { display: flex; margin-bottom: 5px; }
        .prop-meta-item .label { font-weight: bold; min-width: 180px; }
        .prop-body { text-align: justify; }
        .prop-body p { margin-bottom: 1em; }
        .prop-body h3 { margin-top: 25px; margin-bottom: 10px; color: #1B5E20; }

        #proposal-output-container.modern-theme { font-family: 'Lato', -apple-system, sans-serif; }
        .modern-theme .prop-title { font-size: 1.6em; }
        .modern-theme .prop-body h3 { border-left: 4px solid #1B5E20; padding-left: 12px; }
        .modern-theme .prop-body p { text-align: left; }
    </style>
</head>
<body>
    <div class="overleaf-container">
        <div class="editor-pane">
            <form id="proposalForm">
                <h1>Government Proposal Generator</h1>
                <fieldset>
                    <legend>1. Proposing Authority</legend>
                    <input type="text" id="proposingDept" placeholder="Proposing Department/Ministry">
                    <input type="text" id="proposingOfficer" placeholder="Proposing Officer Name & Designation">
                </fieldset>
                <fieldset>
                    <legend>2. Proposal Details</legend>
                    <input type="text" id="proposalTitle" placeholder="Proposal Title (e.g., Smart City Urban Transport Plan)">
                    <select id="proposalCategory">
                        <option value="Infrastructure Development">Infrastructure Development</option>
                        <option value="Public Health">Public Health</option>
                        <option value="Education">Education</option>
                        <option value="Technology & IT">Technology & IT</option>
                        <option value="Environmental">Environmental / Sustainability</option>
                        <option value="Social Welfare">Social Welfare</option>
                        <option value="Defence & Security">Defence & Security</option>
                        <option value="Economic Development">Economic Development</option>
                    </select>
                    <input type="text" id="estimatedBudget" placeholder="Estimated Budget (e.g., $5 Million / Rs. 50 Crore)">
                    <input type="text" id="timeline" placeholder="Proposed Timeline (e.g., 24 months)">
                </fieldset>
                <fieldset>
                    <legend>3. Proposal Content</legend>
                    <textarea id="background" rows="4" placeholder="Background & problem statement: What issue does this proposal address?"></textarea>
                    <textarea id="objectives" rows="4" placeholder="Key objectives (list 3-5 objectives)..."></textarea>
                    <textarea id="methodology" rows="4" placeholder="Proposed approach/methodology: How will this be implemented?"></textarea>
                    <textarea id="expectedOutcomes" rows="3" placeholder="Expected outcomes and impact on public/economy..."></textarea>
                </fieldset>
                <fieldset>
                    <legend>4. Generate & Refine</legend>
                    <button type="button" class="ai-button" onclick="generateProposal()">✨ Generate Government Proposal</button>
                    <textarea id="proposalBody" rows="20" placeholder="The AI-generated proposal will appear here." style="margin-top: 15px;"></textarea>
                </fieldset>
            </form>
        </div>
        <div class="preview-pane">
            <div class="preview-controls">
                <h2>Live Preview</h2>
                <div class="theme-switch-wrapper">
                    <span>Classic</span>
                    <label class="theme-switch"><input type="checkbox" id="theme-toggle"><span class="slider"></span></label>
                    <span>Modern</span>
                </div>
                <button type="button" class="download-button" id="downloadPdfBtn">Download PDF</button>
            </div>
            <div id="proposal-output-container">
                <p style="text-align: center; color: #888; margin-top: 2in;">Your Government Proposal will appear here.</p>
            </div>
        </div>
    </div>
    <div class="loader-overlay" id="loader"><div class="loader"></div></div>
    <style id="prop-styles-for-pdf">
        body { font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 12pt; line-height: 1.7; }
        .prop-title { text-align: center; font-size: 1.4em; font-weight: bold; margin-bottom: 5px; color: #1B5E20; text-transform: uppercase; }
        .prop-subtitle { text-align: center; font-size: 1em; color: #555; margin-bottom: 30px; border-bottom: 2px solid #1B5E20; padding-bottom: 15px; }
        .prop-meta { margin-bottom: 25px; }
        .prop-meta-item { display: flex; margin-bottom: 5px; }
        .prop-meta-item .label { font-weight: bold; min-width: 180px; }
        .prop-body { text-align: justify; }
        .prop-body p { margin-bottom: 1em; }
        .prop-body h3 { margin-top: 25px; margin-bottom: 10px; color: #1B5E20; }
        .modern-theme { font-family: 'Lato', -apple-system, sans-serif; }
        .modern-theme .prop-title { font-size: 1.6em; }
        .modern-theme .prop-body h3 { border-left: 4px solid #1B5E20; padding-left: 12px; }
    </style>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="{{ url_for('static', filename='js/download-payment.js') }}"></script>
    <script>
        const loader = document.getElementById('loader');
        const form = document.getElementById('proposalForm');
        const downloadBtn = document.getElementById('downloadPdfBtn');
        const proposalBodyTextarea = document.getElementById('proposalBody');
        const previewContainer = document.getElementById('proposal-output-container');
        const themeToggle = document.getElementById('theme-toggle');

        async function fetchAIContent(prompt) {
            loader.style.display = 'flex';
            try {
                const response = await fetch('/generate_ai_content', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
                if (!response.ok) { const error = await response.json(); throw new Error(error.error || `HTTP error! status: ${response.status}`); }
                const data = await response.json(); return data.text;
            } catch (error) { console.error("Error:", error); alert(`AI Generation Failed: ${error.message}`); return null; }
            finally { loader.style.display = 'none'; }
        }

        async function generateProposal() {
            const data = {
                proposingDept: document.getElementById('proposingDept').value,
                proposalTitle: document.getElementById('proposalTitle').value,
                proposalCategory: document.getElementById('proposalCategory').value,
                estimatedBudget: document.getElementById('estimatedBudget').value,
                timeline: document.getElementById('timeline').value,
                background: document.getElementById('background').value,
                objectives: document.getElementById('objectives').value,
                methodology: document.getElementById('methodology').value,
                expectedOutcomes: document.getElementById('expectedOutcomes').value,
            };
            if (!data.proposalTitle || !data.background || !data.objectives) {
                alert("Please fill in Proposal Title, Background, and Objectives."); return;
            }
            const prompt = `Write a formal government proposal document. Use section headings on their own lines.

Department: ${data.proposingDept || 'Government Department'}. Title: ${data.proposalTitle}. Category: ${data.proposalCategory}. Budget: ${data.estimatedBudget || 'To be determined'}. Timeline: ${data.timeline || 'To be determined'}. Background: ${data.background}. Objectives: ${data.objectives}. Methodology: ${data.methodology || 'Standard government procedures'}. Expected outcomes: ${data.expectedOutcomes || 'Significant public benefit'}.

Include these sections with headings like "1. Executive Summary", "2. Background & Problem Statement", "3. Objectives", "4. Proposed Methodology", "5. Budget Estimate", "6. Timeline & Milestones", "7. Expected Outcomes & Impact", "8. Risk Assessment", "9. Conclusion & Recommendation". Each heading should be on its own line starting with a number. Generate ONLY the proposal body - no cover page or signature blocks.`;
            const result = await fetchAIContent(prompt);
            if (result) { proposalBodyTextarea.value = result; updatePreview(); }
        }

        function updatePreview() {
            const isModern = themeToggle.checked;
            previewContainer.classList.toggle('modern-theme', isModern);
            const data = {
                proposingDept: document.getElementById('proposingDept').value || 'Government Department',
                proposingOfficer: document.getElementById('proposingOfficer').value || 'Proposing Officer',
                proposalTitle: document.getElementById('proposalTitle').value || 'Proposal Title',
                proposalCategory: document.getElementById('proposalCategory').value,
                estimatedBudget: document.getElementById('estimatedBudget').value || 'TBD',
                timeline: document.getElementById('timeline').value || 'TBD',
                proposalBody: proposalBodyTextarea.value,
            };
            const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            let bodyHtml = '';
            if (data.proposalBody) {
                bodyHtml = data.proposalBody.split('\n').filter(l => l.trim()).map(line => {
                    if (/^\d+\.\s/.test(line.trim())) return `<h3>${line.trim()}</h3>`;
                    return `<p>${line.trim()}</p>`;
                }).join('');
            }
            previewContainer.innerHTML = `
                <div class="prop-title">${data.proposalTitle}</div>
                <div class="prop-subtitle">Government Proposal - ${data.proposalCategory}</div>
                <div class="prop-meta">
                    <div class="prop-meta-item"><span class="label">Proposing Department:</span> <span>${data.proposingDept}</span></div>
                    <div class="prop-meta-item"><span class="label">Proposing Officer:</span> <span>${data.proposingOfficer}</span></div>
                    <div class="prop-meta-item"><span class="label">Date:</span> <span>${today}</span></div>
                    <div class="prop-meta-item"><span class="label">Estimated Budget:</span> <span>${data.estimatedBudget}</span></div>
                    <div class="prop-meta-item"><span class="label">Proposed Timeline:</span> <span>${data.timeline}</span></div>
                </div>
                <div class="prop-body">${bodyHtml || '<p>[Your government proposal will appear here...]</p>'}</div>`;
        }

        async function downloadPDF() {
            const title = document.getElementById('proposalTitle').value;
            if (!title || !proposalBodyTextarea.value) { alert('Please provide a title and generate the proposal first.'); return; }
            loader.style.display = 'flex';
            const styles = document.getElementById('prop-styles-for-pdf').innerHTML;
            const containerClass = themeToggle.checked ? 'modern-theme' : '';
            const fullHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Government Proposal</title><link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet"><style>${styles}</style></head><body class="${containerClass}">${previewContainer.innerHTML}</body></html>`;
            try {
                const response = await fetch('/download_pdf', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ html_content: fullHtml }) });
                if (!response.ok) throw new Error('PDF generation failed');
                const blob = await response.blob(); const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); a.style.display = 'none'; a.href = url;
                a.download = `Govt_Proposal_${title.replace(/[^a-z0-9]/gi, '_').substring(0, 30)}.pdf`;
                document.body.appendChild(a); a.click(); window.URL.revokeObjectURL(url); a.remove();
            } catch (e) { console.error(e); alert(e.message || 'Could not download PDF.'); }
            finally { loader.style.display = 'none'; }
        }

        form.addEventListener('input', updatePreview);
        themeToggle.addEventListener('change', updatePreview);
        downloadBtn.addEventListener('click', downloadPDF);
        updatePreview();
    </script>
</body>
</html>
