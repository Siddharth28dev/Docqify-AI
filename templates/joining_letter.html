<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Joining Letter Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- General & Layout Styles --- */
        :root {
            --primary-color: #1a53ff; /* A strong, corporate blue */
            --secondary-color: #343a40;
            --background-color: #f0f2f5;
            --editor-bg: #ffffff;
            --preview-bg: #f8f9fa;
            --border-color: #dee2e6;
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background-color);
        }
        .overleaf-container { display: flex; height: 100vh; }
        .editor-pane, .preview-pane {
            height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        .editor-pane { flex: 1; background-color: var(--editor-bg); border-right: 1px solid var(--border-color); }
        .preview-pane { flex: 1.2; background-color: var(--preview-bg); }
        .preview-controls {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
        }

        /* --- Form Styles --- */
        #jlForm { max-width: 600px; margin: auto; }
        #jlForm h1 { color: var(--primary-color); text-align: center; }
        #jlForm fieldset { border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        #jlForm legend { font-size: 1.3em; font-weight: 600; color: var(--primary-color); padding: 0 10px; }
        input[type="text"], input[type="date"], textarea {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border-color);
            border-radius: 5px; box-sizing: border-box; font-family: inherit; font-size: 1rem;
        }
        .ai-button, .download-button { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 1em; }
        .ai-button { background-color: #ffc107; color: #333; display: block; width: 100%; margin-top: 10px; }
        .download-button { background-color: #28a745; color: white; }

        /* --- Theme Switch Styles --- */
        .theme-switch-wrapper { display: flex; align-items: center; gap: 10px; }
        .theme-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .theme-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* --- Loader Styles --- */
        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid var(--primary-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- Joining Letter PREVIEW STYLES --- */
        /* BASE (SIMPLE) THEME */
        #jl-output-container {
            max-width: 8.5in; min-height: 11in; margin: 0 auto; background: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.1); padding: 1in; box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 11pt; line-height: 1.5;
            transition: all 0.3s ease;
        }
        .jl-header { text-align: right; margin-bottom: 40px; }
        .jl-header .company-name { font-size: 1.5em; font-weight: bold; }
        .jl-recipient-info { margin-top: 20px; margin-bottom: 20px; }
        .jl-subject { font-weight: bold; margin-top: 20px; margin-bottom: 20px; }
        .jl-body p, .jl-body li { margin-bottom: 1em; }
        .jl-signature-block { margin-top: 40px; }
        .jl-acceptance-block { margin-top: 50px; border-top: 1px solid #ccc; padding-top: 20px; }

        /* MODERN THEME OVERRIDES */
        #jl-output-container.modern-theme {
            font-family: 'Lato', -apple-system, sans-serif;
            font-size: 10pt;
        }
        .modern-theme .jl-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            text-align: left; border-bottom: 2px solid var(--primary-color); padding-bottom: 20px;
        }
        .modern-theme .jl-header .logo-placeholder { font-size: 2em; font-weight: bold; color: var(--primary-color); }
        .modern-theme .jl-header .company-address { text-align: right; font-size: 9pt; color: #555; }
        .modern-theme .jl-subject { font-size: 1.2em; }
        .modern-theme .jl-body h3 { color: var(--primary-color); font-size: 1.1em; margin-top: 1.5em; margin-bottom: 0.5em; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .modern-theme .jl-acceptance-block { background-color: #f8f9fa; padding: 25px; border-radius: 8px; border: none; }
    </style>
</head>
<body>

    <div class="overleaf-container">
        <!-- Editor Pane -->
        <div class="editor-pane">
            <form id="jlForm">
                <h1>Joining Letter Generator</h1>
                <fieldset>
                    <legend>Company Details</legend>
                    <input type="text" id="companyName" placeholder="Company Full Name">
                    <input type="text" id="companyAddress" placeholder="Company Full Address">
                    <input type="text" id="hrManager" placeholder="Issuing Manager Name (e.g., HR Manager)">
                </fieldset>
                <fieldset>
                    <legend>Candidate & Offer Details</legend>
                    <input type="text" id="candidateName" placeholder="Candidate's Full Name">
                    <input type="text" id="jobTitle" placeholder="Job Title">
                    <input type="date" id="startDate">
                    <input type="text" id="reportingManager" placeholder="Reporting Manager's Name and Title">
                    <input type="text" id="workLocation" placeholder="Work Location (Office Address or 'Remote')">
                </fieldset>
                <fieldset>
                    <legend>Compensation Package</legend>
                    <input type="text" id="baseSalary" placeholder="Annual Base Salary (e.g., $150,000 USD)">
                    <textarea id="bonusEquity" rows="3" placeholder="Bonus and/or Equity details (if any). Be specific about terms."></textarea>
                </fieldset>
                <fieldset>
                    <legend>Standard Clauses</legend>
                    <input type="text" id="probationPeriod" placeholder="Probation Period (e.g., 90 days)">
                    <input type="text" id="noticePeriod" placeholder="Notice Period (e.g., 30 days)">
                </fieldset>
                <fieldset>
                    <legend>Generate & Refine</legend>
                    <button type="button" class="ai-button" onclick="generateLetter()">✨ Assemble Full Letter</button>
                    <textarea id="letterBody" rows="15" placeholder="The assembled letter body will appear here. You can add or edit clauses before finalizing." style="margin-top: 15px;"></textarea>
                </fieldset>
            </form>
        </div>

        <!-- Preview Pane -->
        <div class="preview-pane">
            <div class="preview-controls">
                <h2>Live Preview</h2>
                <div class="theme-switch-wrapper">
                    <span>Simple</span>
                    <label class="theme-switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider"></span>
                    </label>
                    <span>Modern</span>
                </div>
                <button type="button" class="download-button" id="downloadPdfBtn">Download PDF</button>
            </div>
            <div id="jl-output-container">
                <p style="text-align: center; color: #888; margin-top: 2in;">Your Joining Letter will appear here.</p>
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div class="loader-overlay" id="loader"><div class="loader"></div></div>

    <!-- Hidden styles for the PDF -->
    <style id="jl-styles-for-pdf">
        /* BASE (SIMPLE) THEME */
        body { font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 11pt; line-height: 1.5; }
        .jl-header { text-align: right; margin-bottom: 40px; }
        .jl-header .company-name { font-size: 1.5em; font-weight: bold; }
        .jl-recipient-info { margin-top: 20px; margin-bottom: 20px; }
        .jl-subject { font-weight: bold; margin-top: 20px; margin-bottom: 20px; }
        .jl-body p, .jl-body li { margin-bottom: 1em; }
        .jl-signature-block { margin-top: 40px; }
        .jl-acceptance-block { margin-top: 50px; border-top: 1px solid #ccc; padding-top: 20px; font-size: 10pt; }

        /* MODERN THEME OVERRIDES */
        .modern-theme { font-family: 'Lato', -apple-system, sans-serif; font-size: 10pt; }
        .modern-theme .jl-header { display: flex; justify-content: space-between; align-items: flex-start; text-align: left; border-bottom: 2px solid #1a53ff; padding-bottom: 20px; }
        .modern-theme .jl-header .logo-placeholder { font-size: 2em; font-weight: bold; color: #1a53ff; }
        .modern-theme .jl-header .company-address { text-align: right; font-size: 9pt; color: #555; }
        .modern-theme .jl-subject { font-size: 1.2em; }
        .modern-theme .jl-body h3 { color: #1a53ff; font-size: 1.1em; margin-top: 1.5em; margin-bottom: 0.5em; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .modern-theme .jl-acceptance-block { background-color: #f8f9fa; padding: 25px; border-radius: 8px; border: none; }
    </style>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="{{ url_for('static', filename='js/download-payment.js') }}"></script>
    <script>
        const loader = document.getElementById('loader');
        const form = document.getElementById('jlForm');
        const downloadBtn = document.getElementById('downloadPdfBtn');
        const letterBodyTextarea = document.getElementById('letterBody');
        const previewContainer = document.getElementById('jl-output-container');
        const themeToggle = document.getElementById('theme-toggle');

        async function fetchAIContent(prompt) { /* ... (same as previous) ... */ }

        async function generateLetter() {
            const data = {
                companyName: document.getElementById('companyName').value,
                candidateName: document.getElementById('candidateName').value,
                jobTitle: document.getElementById('jobTitle').value,
                startDate: document.getElementById('startDate').value,
                reportingManager: document.getElementById('reportingManager').value,
                baseSalary: document.getElementById('baseSalary').value,
                bonusEquity: document.getElementById('bonusEquity').value,
                probationPeriod: document.getElementById('probationPeriod').value,
                noticePeriod: document.getElementById('noticePeriod').value,
            };

            if (!data.companyName || !data.candidateName || !data.jobTitle || !data.startDate || !data.baseSalary) {
                alert("Please fill in all required fields: Company, Candidate, Job Title, Start Date, and Salary.");
                return;
            }

            const prompt = `
                You are an HR professional. Assemble the body of a formal offer of employment letter using the following structured data. The tone should be welcoming but formal and legally sound. Structure the content with clear paragraphs for each key term.

                **Data:**
                - Company: ${data.companyName}
                - Candidate: ${data.candidateName}
                - Position: ${data.jobTitle}
                - Start Date: ${data.startDate}
                - Reports to: ${data.reportingManager}
                - Base Salary: ${data.baseSalary}
                - Additional Compensation: ${data.bonusEquity || 'N/A'}
                - Probation Period: ${data.probationPeriod || 'N/A'}
                - Notice Period: ${data.noticePeriod || '30 days'}

                **Instructions:**
                Generate ONLY the letter body, from the main introductory paragraph to the closing paragraph before the "Sincerely,". Use professional language to present each clause clearly. For example, start with a paragraph like "Further to our recent discussions, we are delighted to offer you the position of...". Then, create separate paragraphs or numbered items for Position, Start Date, Compensation, etc. Conclude with a paragraph about looking forward to them joining and how to accept the offer.
            `;

            const result = await fetchAIContent(prompt);
            if (result) {
                letterBodyTextarea.value = result;
                updatePreview();
            }
        }

        function updatePreview() {
            const isModern = themeToggle.checked;
            previewContainer.classList.toggle('modern-theme', isModern);

            const data = {
                companyName: document.getElementById('companyName').value,
                companyAddress: document.getElementById('companyAddress').value,
                hrManager: document.getElementById('hrManager').value || 'HR Manager',
                candidateName: document.getElementById('candidateName').value,
                jobTitle: document.getElementById('jobTitle').value,
                letterBody: letterBodyTextarea.value,
            };

            const today = new Date();
            const dateString = today.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            const bodyWithParagraphs = data.letterBody.split('\n').filter(p => p.trim() !== '').map(p => `<p>${p.trim()}</p>`).join('');

            let html = `
                <div class="jl-header">
                    ${isModern ? `<div class="logo-placeholder">${data.companyName.split(' ')[0] || 'Logo'}</div>` : `<div class="company-name">${data.companyName || 'Company Name'}</div>`}
                    <div class="company-address">${data.companyAddress.replace(/\n/g, '<br>') || 'Company Address'}</div>
                </div>
                <div class="jl-date">${dateString}</div>
                <div class="jl-recipient-info">
                    <div>${data.candidateName || 'Candidate Name'}</div>
                </div>
                <div class="jl-subject">Subject: Offer of Employment – ${data.jobTitle || 'Position'}</div>
                <div class="jl-salutation">Dear ${data.candidateName || 'Candidate'},</div>
                <div class="jl-body">${bodyWithParagraphs || '<p>[Letter content will be assembled here...]</p>'}</div>
                <div class="jl-signature-block">
                    <p>Sincerely,</p><br><br>
                    <p>_________________________</p>
                    <p><strong>${data.hrManager}</strong></p>
                    <p>${data.companyName}</p>
                </div>
                <div class="jl-acceptance-block">
                    <p><strong>ACCEPTANCE OF OFFER</strong></p>
                    <p>I, ${data.candidateName}, hereby accept the offer of employment as detailed in this letter.</p>
                    <br><br>
                    <p>Signature: _________________________      Date: _________________________</p>
                </div>
            `;

            previewContainer.innerHTML = html;
        }

        async function downloadPDF() { /* ... (same as previous, with updated filename logic) ... */ }

        // Re-pasting full functions for completeness
        async function fetchAIContent(prompt) {
            loader.style.display = 'flex';
            try {
                const response = await fetch('/generate_ai_content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                if (!response.ok) { const error = await response.json(); throw new Error(error.error || `HTTP error! status: ${response.status}`); }
                const data = await response.json();
                return data.text;
            } catch (error) {
                console.error("Error fetching AI content:", error);
                alert(`AI Generation Failed: ${error.message}`);
                return null;
            } finally {
                loader.style.display = 'none';
            }
        }
        async function downloadPDF() {
            const candidateName = document.getElementById('candidateName').value;
            if (!candidateName || !letterBodyTextarea.value) {
                alert('Please provide the candidate\'s name and assemble the letter before downloading.');
                return;
            }
            loader.style.display = 'flex';
            const contentToPrint = previewContainer.innerHTML;
            const styles = document.getElementById('jl-styles-for-pdf').innerHTML;
            const isModern = themeToggle.checked;
            const containerClass = isModern ? 'modern-theme' : '';
            const fullHtmlContent = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Joining Letter</title><link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet"><style>${styles}</style></head><body class="${containerClass}">${contentToPrint}</body></html>`;
            try {
                const response = await fetch('/download_pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ html_content: fullHtmlContent })
                });
                if (!response.ok) throw new Error(`PDF generation failed: ${response.statusText}`);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                const safeAppName = candidateName.replace(/[^a-z0-9]/gi, '_').replace(/_+/g, '_');
                a.download = `Joining_Letter_for_${safeAppName || 'candidate'}.pdf`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
            } catch (error) {
                console.error('Error downloading PDF:', error);
                alert(error.message || 'Could not download PDF. See console for details.');
            } finally {
                loader.style.display = 'none';
            }
        }

        // --- Event Listeners ---
        form.addEventListener('input', updatePreview);
        themeToggle.addEventListener('change', updatePreview);
        downloadBtn.addEventListener('click', downloadPDF);

        // --- Initial Load ---
        updatePreview();
    </script>
</body>
</html>
