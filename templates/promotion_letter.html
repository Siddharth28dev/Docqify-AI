<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Promotion Letter Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- General & Layout Styles --- */
        :root {
            --primary-color: #007bff; /* A confident, positive blue */
            --secondary-color: #343a40;
            --background-color: #f0f2f5;
            --editor-bg: #ffffff;
            --preview-bg: #f8f9fa;
            --border-color: #dee2e6;
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background-color);
        }
        .overleaf-container { display: flex; height: 100vh; }
        .editor-pane, .preview-pane {
            height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        .editor-pane { flex: 1; background-color: var(--editor-bg); border-right: 1px solid var(--border-color); }
        .preview-pane { flex: 1.2; background-color: var(--preview-bg); }
        .preview-controls {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
        }

        /* --- Form Styles --- */
        #promotionForm { max-width: 600px; margin: auto; }
        #promotionForm h1 { color: var(--primary-color); text-align: center; }
        #promotionForm fieldset { border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        #promotionForm legend { font-size: 1.3em; font-weight: 600; color: var(--primary-color); padding: 0 10px; }
        input[type="text"], input[type="date"], textarea {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border-color);
            border-radius: 5px; box-sizing: border-box; font-family: inherit; font-size: 1rem;
        }
        .ai-button, .download-button { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 1em; }
        .ai-button { background-color: #ffc107; color: #333; display: block; width: 100%; margin-top: 10px; }
        .download-button { background-color: #28a745; color: white; }

        /* --- Theme Switch Styles --- */
        .theme-switch-wrapper { display: flex; align-items: center; gap: 10px; }
        .theme-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .theme-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* --- Loader Styles --- */
        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid var(--primary-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- Promotion Letter PREVIEW STYLES --- */
        /* BASE (SIMPLE) THEME */
        #promotion-output-container {
            max-width: 8.5in; min-height: 11in; margin: 0 auto; background: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.1); padding: 1in; box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 11pt; line-height: 1.5;
            transition: all 0.3s ease;
        }
        .promo-header { text-align: center; margin-bottom: 40px; }
        .promo-header .company-name { font-size: 1.6em; font-weight: bold; }
        .promo-recipient-info { margin-top: 20px; margin-bottom: 20px; }
        .promo-subject { font-weight: bold; margin-top: 20px; margin-bottom: 20px; }
        .promo-body p { margin-bottom: 1em; }
        .promo-signature-block { margin-top: 40px; }

        /* MODERN THEME OVERRIDES */
        #promotion-output-container.modern-theme {
            font-family: 'Lato', -apple-system, sans-serif;
            font-size: 10pt;
        }
        .modern-theme .promo-header {
            display: flex; justify-content: space-between; align-items: center;
            text-align: left; border-bottom: 2px solid var(--primary-color); padding-bottom: 15px;
        }
        .modern-theme .promo-header .logo-placeholder { font-size: 1.8em; font-weight: bold; color: var(--primary-color); }
        .modern-theme .promo-header .header-date { text-align: right; font-size: 10pt; color: #555; }
        .modern-theme .promo-subject { font-size: 1.2em; font-weight: 700; }
        .modern-theme .promo-body h3 { color: var(--primary-color); font-size: 1.1em; margin-top: 1.5em; margin-bottom: 0.5em; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    </style>
</head>
<body>

    <div class="overleaf-container">
        <!-- Editor Pane -->
        <div class="editor-pane">
            <form id="promotionForm">
                <h1>Promotion Letter Generator</h1>
                <fieldset>
                    <legend>Company & Manager Details</legend>
                    <input type="text" id="companyName" placeholder="Company Name">
                    <input type="text" id="managerName" placeholder="Your Name (Manager/HR)">
                    <input type="text" id="managerTitle" placeholder="Your Title">
                </fieldset>
                <fieldset>
                    <legend>Employee & Promotion Details</legend>
                    <input type="text" id="employeeName" placeholder="Employee's Full Name">
                    <input type="text" id="currentJobTitle" placeholder="Current Job Title">
                    <input type="text" id="newJobTitle" placeholder="New Job Title">
                    <label for="effectiveDate">Effective Date of Promotion</label>
                    <input type="date" id="effectiveDate">
                </fieldset>
                <fieldset>
                    <legend>Rationale & Responsibilities</legend>
                    <textarea id="performanceHighlights" rows="4" placeholder="Reason for promotion (e.g., 'outstanding performance on Project X', 'leadership skills')."></textarea>
                    <textarea id="newResponsibilities" rows="4" placeholder="Briefly describe new key responsibilities."></textarea>
                </fieldset>
                <fieldset>
                    <legend>New Compensation</legend>
                    <input type="text" id="newSalary" placeholder="New Annual Salary / CTC">
                    <input type="text" id="newBonus" placeholder="New Bonus Structure (if applicable)">
                </fieldset>
                <fieldset>
                    <legend>Generate & Refine</legend>
                    <button type="button" class="ai-button" onclick="generateLetter()">✨ Assemble Letter</button>
                    <textarea id="letterBody" rows="15" placeholder="The assembled letter body will appear here. Review for accuracy and tone." style="margin-top: 15px;"></textarea>
                </fieldset>
            </form>
        </div>

        <!-- Preview Pane -->
        <div class="preview-pane">
            <div class="preview-controls">
                <h2>Live Preview</h2>
                <div class="theme-switch-wrapper">
                    <span>Simple</span>
                    <label class="theme-switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider"></span>
                    </label>
                    <span>Modern</span>
                </div>
                <button type="button" class="download-button" id="downloadPdfBtn">Download PDF</button>
            </div>
            <div id="promotion-output-container">
                <p style="text-align: center; color: #888; margin-top: 2in;">Your Promotion Letter will appear here.</p>
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div class="loader-overlay" id="loader"><div class="loader"></div></div>

    <!-- Hidden styles for PDF -->
    <style id="promo-styles-for-pdf">
        body { font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 11pt; line-height: 1.5; }
        .promo-header { text-align: center; margin-bottom: 40px; }
        .promo-header .company-name { font-size: 1.6em; font-weight: bold; }
        .promo-recipient-info { margin-top: 20px; margin-bottom: 20px; }
        .promo-subject { font-weight: bold; margin-top: 20px; margin-bottom: 20px; }
        .promo-body p { margin-bottom: 1em; }
        .promo-signature-block { margin-top: 40px; }
        .modern-theme { font-family: 'Lato', -apple-system, sans-serif; font-size: 10pt; }
        .modern-theme .promo-header { display: flex; justify-content: space-between; align-items: center; text-align: left; border-bottom: 2px solid #007bff; padding-bottom: 15px; }
        .modern-theme .promo-header .logo-placeholder { font-size: 1.8em; font-weight: bold; color: #007bff; }
        .modern-theme .promo-header .header-date { text-align: right; font-size: 10pt; color: #555; }
        .modern-theme .promo-subject { font-size: 1.2em; font-weight: 700; }
        .modern-theme .promo-body h3 { color: #007bff; font-size: 1.1em; margin-top: 1.5em; margin-bottom: 0.5em; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    </style>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="{{ url_for('static', filename='js/download-payment.js') }}"></script>
    <script>
        const loader = document.getElementById('loader');
        const form = document.getElementById('promotionForm');
        const downloadBtn = document.getElementById('downloadPdfBtn');
        const letterBodyTextarea = document.getElementById('letterBody');
        const previewContainer = document.getElementById('promotion-output-container');
        const themeToggle = document.getElementById('theme-toggle');

        async function fetchAIContent(prompt) {
            loader.style.display = 'flex';
            try {
                const response = await fetch('/generate_ai_content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                if (!response.ok) { const error = await response.json(); throw new Error(error.error || `HTTP error! status: ${response.status}`); }
                const data = await response.json();
                return data.text;
            } catch (error) {
                console.error("Error fetching AI content:", error);
                alert(`AI Generation Failed: ${error.message}`);
                return null;
            } finally {
                loader.style.display = 'none';
            }
        }

        async function generateLetter() {
            const data = {
                employeeName: document.getElementById('employeeName').value,
                currentJobTitle: document.getElementById('currentJobTitle').value,
                newJobTitle: document.getElementById('newJobTitle').value,
                effectiveDate: document.getElementById('effectiveDate').value,
                performanceHighlights: document.getElementById('performanceHighlights').value,
                newResponsibilities: document.getElementById('newResponsibilities').value,
                newSalary: document.getElementById('newSalary').value,
                newBonus: document.getElementById('newBonus').value,
            };

            if (!data.employeeName || !data.currentJobTitle || !data.newJobTitle || !data.effectiveDate || !data.newSalary) {
                alert("Please fill in all required fields in the Employee, Promotion, and Compensation sections.");
                return;
            }

            const prompt = `
                You are an experienced HR Director. Assemble a formal and congratulatory promotion letter.

                **Data:**
                - Employee: ${data.employeeName}
                - Promotion: From '${data.currentJobTitle}' to '${data.newJobTitle}'
                - Effective Date: ${data.effectiveDate}
                - Rationale for Promotion: ${data.performanceHighlights}
                - New Responsibilities Summary: ${data.newResponsibilities}
                - New Annual Salary/CTC: ${data.newSalary}
                - New Bonus Structure: ${data.newBonus || 'As per company policy.'}

                **Instructions:**
                1.  **Opening:** Start with a strong, congratulatory opening. State the promotion from the old title to the new title and its effective date.
                2.  **Rationale:** Write a paragraph acknowledging the employee's hard work and contributions, using the "Rationale for Promotion" as a basis.
                3.  **New Role:** Briefly outline the new responsibilities.
                4.  **Compensation:** Clearly state the new salary and mention the bonus structure.
                5.  **Closing:** End with a confident and encouraging statement, expressing excitement for their continued growth with the company.
                6.  **IMPORTANT:** Generate ONLY the letter body. Do not include salutations, subjects, dates, or signatures.
            `;

            const result = await fetchAIContent(prompt);
            if (result) {
                letterBodyTextarea.value = result;
                updatePreview();
            }
        }

        function updatePreview() {
            const isModern = themeToggle.checked;
            previewContainer.classList.toggle('modern-theme', isModern);

            const data = {
                companyName: document.getElementById('companyName').value,
                managerName: document.getElementById('managerName').value || 'HR Manager',
                managerTitle: document.getElementById('managerTitle').value || 'Human Resources',
                employeeName: document.getElementById('employeeName').value,
                letterBody: letterBodyTextarea.value,
            };

            const today = new Date();
            const dateString = today.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            const bodyWithParagraphs = data.letterBody.split('\n').filter(p => p.trim() !== '').map(p => `<p>${p.trim()}</p>`).join('');

            let html = `
                <div class="promo-header">
                    ${isModern ? `<div class="logo-placeholder">${data.companyName.split(' ')[0] || 'Company'}</div><div class="header-date">Date: ${dateString}</div>` : `<div class="company-name">${data.companyName || 'Company Name'}</div>`}
                </div>
                ${!isModern ? `<div class="promo-date">Date: ${dateString}</div>` : ''}
                <div class="promo-recipient-info">
                    <div><strong>To,</strong></div>
                    <div>${data.employeeName || 'Employee Name'}</div>
                </div>
                <div class="promo-subject">Subject: Letter of Promotion</div>
                <div class="promo-salutation">Dear ${data.employeeName || 'Employee'},</div>
                <div class="promo-body">${bodyWithParagraphs || '<p>[Letter content will be assembled here...]</p>'}</div>
                <div class="promo-signature-block">
                    <p>Congratulations and best wishes,</p><br><br>
                    <p>_________________________</p>
                    <p><strong>${data.managerName}</strong></p>
                    <p>${data.managerTitle}</p>
                    <p>${data.companyName}</p>
                </div>
            `;

            previewContainer.innerHTML = html;
        }

        async function downloadPDF() {
            const employeeName = document.getElementById('employeeName').value;
            if (!employeeName || !letterBodyTextarea.value) {
                alert('Please provide the employee\'s name and assemble the letter before downloading.');
                return;
            }
            loader.style.display = 'flex';
            const contentToPrint = previewContainer.innerHTML;
            const styles = document.getElementById('promo-styles-for-pdf').innerHTML;
            const isModern = themeToggle.checked;
            const containerClass = isModern ? 'modern-theme' : '';
            const fullHtmlContent = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Promotion Letter</title><link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet"><style>${styles}</style></head><body class="${containerClass}">${contentToPrint}</body></html>`;
            try {
                const response = await fetch('/download_pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ html_content: fullHtmlContent })
                });
                if (!response.ok) throw new Error(`PDF generation failed: ${response.statusText}`);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                const safeName = employeeName.replace(/[^a-z0-9]/gi, '_').replace(/_+/g, '_');
                a.download = `Promotion_Letter_for_${safeName || 'employee'}.pdf`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
            } catch (error) {
                console.error('Error downloading PDF:', error);
                alert(error.message || 'Could not download PDF. See console for details.');
            } finally {
                loader.style.display = 'none';
            }
        }

        // --- Event Listeners ---
        form.addEventListener('input', updatePreview);
        themeToggle.addEventListener('change', updatePreview);
        downloadBtn.addEventListener('click', downloadPDF);

        // --- Initial Load ---
        updatePreview();
    </script>
</body>
</html>
