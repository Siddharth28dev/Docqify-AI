<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SOP Generator - Academic Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- General & Layout Styles --- */
        :root {
            --primary-color: #4A0E6B; /* Academic deep purple */
            --secondary-color: #333;
            --background-color: #f0f2f5;
            --editor-bg: #ffffff;
            --preview-bg: #fafafa;
            --border-color: #d9d9d9;
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background-color);
        }
        .overleaf-container { display: flex; height: 100vh; }
        .editor-pane, .preview-pane {
            height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        .editor-pane { flex: 1; background-color: var(--editor-bg); border-right: 1px solid var(--border-color); }
        .preview-pane { flex: 1.2; background-color: var(--preview-bg); }
        .preview-controls {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
        }

        /* --- Form Styles --- */
        #sopForm { max-width: 600px; margin: auto; }
        #sopForm h1 { color: var(--primary-color); text-align: center; }
        #sopForm fieldset { border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        #sopForm legend { font-size: 1.3em; font-weight: 600; color: var(--primary-color); padding: 0 10px; }
        input[type="text"], select, textarea {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border-color);
            border-radius: 5px; box-sizing: border-box; font-family: inherit; font-size: 1rem;
        }
        .ai-button, .download-button { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 1em; }
        .ai-button { background-color: #ffc107; color: #333; display: block; width: 100%; margin-top: 10px; }
        .download-button { background-color: #28a745; color: white; }

        /* --- Theme Switch Styles --- */
        .theme-switch-wrapper { display: flex; align-items: center; gap: 10px; }
        .theme-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .theme-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* --- Loader Styles --- */
        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid var(--primary-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- SOP PREVIEW STYLES --- */
        /* BASE (CLASSIC) THEME */
        #sop-output-container {
            max-width: 8.5in; min-height: 11in; margin: 0 auto; background: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.1); padding: 1in; box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', Times, serif; color: #222; font-size: 12pt;
            transition: all 0.3s ease;
        }
        .sop-header { text-align: center; margin-bottom: 40px; }
        .sop-header .name { font-size: 1.4em; font-weight: bold; }
        .sop-header .program { font-size: 1.1em; color: #555; }
        .sop-body { text-align: justify; line-height: 1.8; }
        .sop-body p { margin: 0 0 1.2em 0; text-indent: 2em; }

        /* MODERN (SHINY) THEME OVERRIDES */
        #sop-output-container.modern-theme {
            font-family: 'Lato', -apple-system, sans-serif;
        }
        .modern-theme .sop-header {
            text-align: left;
            border-top: 4px solid var(--primary-color);
            padding-top: 15px;
            margin-bottom: 30px;
        }
        .modern-theme .sop-header .name {
            font-size: 1.8em;
            color: var(--primary-color);
        }
        .modern-theme .sop-header .program {
            font-size: 1.2em;
        }
        .modern-theme .sop-body p {
            text-indent: 0; /* Remove indent for block paragraphs */
        }
    </style>
</head>
<body>

    <div class="overleaf-container">
        <!-- Editor Pane -->
        <div class="editor-pane">
            <form id="sopForm">
                <h1>SOP Generator</h1>
                <fieldset>
                    <legend>1. Target Program</legend>
                    <input type="text" id="yourName" placeholder="Your Full Name">
                    <input type="text" id="institutionName" placeholder="University/Institution Name">
                    <input type="text" id="programName" placeholder="Program/Course Name (e.g., MSc in Computer Science)">
                    <select id="programType">
                        <option value="Master's">Master's Program</option>
                        <option value="PhD">PhD Program</option>
                        <option value="Undergraduate">Undergraduate Program</option>
                        <option value="Scholarship">Scholarship / Fellowship</option>
                        <option value="Internship">Internship</option>
                    </select>
                </fieldset>
                <fieldset>
                    <legend>2. Your Background</legend>
                    <textarea id="academicBackground" rows="5" placeholder="Your academic background: degrees, major, key courses..."></textarea>
                    <textarea id="workExperience" rows="6" placeholder="Your experience: internships, research, relevant jobs..."></textarea>
                    <textarea id="skillsAchievements" rows="4" placeholder="Key skills & achievements: awards, publications..."></textarea>
                </fieldset>
                <fieldset>
                    <legend>3. Your Motivation & Goals</legend>
                    <textarea id="whyProgram" rows="5" placeholder="Why THIS program? Mention specific professors, labs, courses..."></textarea>
                    <textarea id="futureGoals" rows="4" placeholder="What are your long-term career goals after this program?"></textarea>
                </fieldset>
                <fieldset>
                    <legend>4. Generate & Refine</legend>
                    <button type="button" class="ai-button" onclick="generateSOP()">✨ Generate SOP with AI</button>
                    <textarea id="sopBody" rows="15" placeholder="The AI-generated Statement of Purpose will appear here. You can (and should) edit it manually to perfect it." style="margin-top: 15px;"></textarea>
                </fieldset>
            </form>
        </div>

        <!-- Preview Pane -->
        <div class="preview-pane">
            <div class="preview-controls">
                <h2>Live Preview</h2>
                <div class="theme-switch-wrapper">
                    <span>Classic</span>
                    <label class="theme-switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider"></span>
                    </label>
                    <span>Modern</span>
                </div>
                <button type="button" class="download-button" id="downloadPdfBtn">Download PDF</button>
            </div>
            <div id="sop-output-container">
                <p style="text-align: center; color: #888; margin-top: 2in;">Your Statement of Purpose will appear here.</p>
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div class="loader-overlay" id="loader"><div class="loader"></div></div>

    <!-- Hidden styles for the PDF -->
    <style id="sop-styles-for-pdf">
        /* BASE (CLASSIC) THEME */
        body { font-family: 'Georgia', 'Times New Roman', Times, serif; color: #222; font-size: 12pt; }
        .sop-header { text-align: center; margin-bottom: 40px; }
        .sop-header .name { font-size: 1.4em; font-weight: bold; }
        .sop-header .program { font-size: 1.1em; color: #555; }
        .sop-body { text-align: justify; line-height: 1.8; }
        .sop-body p { margin: 0 0 1.2em 0; text-indent: 2em; }

        /* MODERN (SHINY) THEME OVERRIDES */
        .modern-theme { font-family: 'Lato', -apple-system, sans-serif; }
        .modern-theme .sop-header { text-align: left; border-top: 4px solid #4A0E6B; padding-top: 15px; margin-bottom: 30px; }
        .modern-theme .sop-header .name { font-size: 1.8em; color: #4A0E6B; }
        .modern-theme .sop-header .program { font-size: 1.2em; }
        .modern-theme .sop-body p { text-indent: 0; }
    </style>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="{{ url_for('static', filename='js/download-payment.js') }}"></script>
    <script>
        // --- DOM Element References ---
        const loader = document.getElementById('loader');
        const form = document.getElementById('sopForm');
        const downloadBtn = document.getElementById('downloadPdfBtn');
        const sopBodyTextarea = document.getElementById('sopBody');
        const previewContainer = document.getElementById('sop-output-container');
        const themeToggle = document.getElementById('theme-toggle');

        // --- Core Functions ---
        async function fetchAIContent(prompt) {
            loader.style.display = 'flex';
            try {
                const response = await fetch('/generate_ai_content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || `HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                return data.text;
            } catch (error) {
                console.error("Error fetching AI content:", error);
                alert(`AI Generation Failed: ${error.message}`);
                return null;
            } finally {
                loader.style.display = 'none';
            }
        }

        async function generateSOP() {
            const data = {
                programName: document.getElementById('programName').value,
                institutionName: document.getElementById('institutionName').value,
                programType: document.getElementById('programType').value,
                academicBackground: document.getElementById('academicBackground').value,
                workExperience: document.getElementById('workExperience').value,
                skillsAchievements: document.getElementById('skillsAchievements').value,
                whyProgram: document.getElementById('whyProgram').value,
                futureGoals: document.getElementById('futureGoals').value,
            };

            if (!data.programName || !data.institutionName || !data.academicBackground || !data.whyProgram || !data.futureGoals) {
                alert("Please fill in all required fields (Program, Institution, Background, Why Program, and Goals).");
                return;
            }

            const prompt = `Write a compelling and highly structured Statement of Purpose (SOP). Target: ${data.programType} in ${data.programName} at ${data.institutionName}. Profile: Academics - ${data.academicBackground}; Experience - ${data.workExperience}; Skills - ${data.skillsAchievements}. Motivations: Why this program - ${data.whyProgram}; Future goals - ${data.futureGoals}. Instructions: Structure with Introduction, Background, Why Program, Future Goals, and Conclusion. Tone should be professional and enthusiastic. Generate only the essay body, starting with the first paragraph.`;

            const result = await fetchAIContent(prompt);
            if (result) {
                sopBodyTextarea.value = result;
                updatePreview();
            }
        }

        function updatePreview() {
            const isModern = themeToggle.checked;
            previewContainer.classList.toggle('modern-theme', isModern);

            const yourName = document.getElementById('yourName').value;
            const programName = document.getElementById('programName').value;
            const sopBody = sopBodyTextarea.value;

            const bodyWithParagraphs = sopBody.split('\n').filter(p => p.trim() !== '').map(p => `<p>${p.trim()}</p>`).join('');

            const html = `
                <div class="sop-header">
                    <div class="name">${yourName || 'Your Name'}</div>
                    <div class="program">Statement of Purpose for ${programName || 'the Program'}</div>
                </div>
                <div class="sop-body">
                    ${bodyWithParagraphs || '<p style="text-indent: 0;">[Your Statement of Purpose will appear here...]</p>'}
                </div>
            `;
            previewContainer.innerHTML = html;
        }

        async function downloadPDF() {
            const programName = document.getElementById('programName').value;
            const yourName = document.getElementById('yourName').value;
            if (!yourName || !sopBodyTextarea.value) {
                alert('Please enter your name and generate some content before downloading.');
                return;
            }

            loader.style.display = 'flex';
            const contentToPrint = previewContainer.innerHTML;
            const styles = document.getElementById('sop-styles-for-pdf').innerHTML;
            const isModern = themeToggle.checked;
            const containerClass = isModern ? 'modern-theme' : '';

            const fullHtmlContent = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Statement of Purpose</title><link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet"><style>${styles}</style></head><body class="${containerClass}">${contentToPrint}</body></html>`;

            try {
                const response = await fetch('/download_pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ html_content: fullHtmlContent })
                });
                if (!response.ok) throw new Error(`PDF generation failed: ${response.statusText}`);

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                const safeProgramName = programName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                a.download = `SOP_${safeProgramName || 'application'}.pdf`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
            } catch (error) {
                console.error('Error downloading PDF:', error);
                alert(error.message || 'Could not download PDF. See console for details.');
            } finally {
                loader.style.display = 'none';
            }
        }

        // --- Event Listeners ---
        form.addEventListener('input', updatePreview);
        themeToggle.addEventListener('change', updatePreview);
        downloadBtn.addEventListener('click', downloadPDF);

        // --- Initial Load ---
        updatePreview();
    </script>
</body>
</html>
