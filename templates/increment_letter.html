<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Salary Increment Letter Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- General & Layout Styles --- */
        :root {
            --primary-color: #004085; /* A rich, professional blue */
            --secondary-color: #343a40;
            --background-color: #f0f2f5;
            --editor-bg: #ffffff;
            --preview-bg: #f8f9fa;
            --border-color: #dee2e6;
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background-color);
        }
        .overleaf-container { display: flex; height: 100vh; }
        .editor-pane, .preview-pane {
            height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        .editor-pane { flex: 1; background-color: var(--editor-bg); border-right: 1px solid var(--border-color); }
        .preview-pane { flex: 1.2; background-color: var(--preview-bg); }
        .preview-controls {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
        }

        /* --- Form Styles --- */
        #incrementForm { max-width: 600px; margin: auto; }
        #incrementForm h1 { color: var(--primary-color); text-align: center; }
        #incrementForm fieldset { border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        #incrementForm legend { font-size: 1.3em; font-weight: 600; color: var(--primary-color); padding: 0 10px; }
        input[type="text"], input[type="date"], textarea {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border-color);
            border-radius: 5px; box-sizing: border-box; font-family: inherit; font-size: 1rem;
        }
        .ai-button, .download-button { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 1em; }
        .ai-button { background-color: #ffc107; color: #333; display: block; width: 100%; margin-top: 10px; }
        .download-button { background-color: #28a745; color: white; }

        /* --- Theme Switch Styles --- */
        .theme-switch-wrapper { display: flex; align-items: center; gap: 10px; }
        .theme-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .theme-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* --- Loader Styles --- */
        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid var(--primary-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- Increment Letter PREVIEW STYLES --- */
        /* BASE (SIMPLE) THEME */
        #increment-output-container {
            max-width: 8.5in; min-height: 11in; margin: 0 auto; background: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.1); padding: 1in; box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 11pt; line-height: 1.5;
            transition: all 0.3s ease;
        }
        .inc-header { text-align: center; margin-bottom: 40px; }
        .inc-header .company-name { font-size: 1.6em; font-weight: bold; }
        .inc-recipient-info { margin-top: 20px; margin-bottom: 20px; }
        .inc-subject { font-weight: bold; margin-top: 20px; margin-bottom: 20px; }
        .inc-body p { margin-bottom: 1em; }
        .inc-signature-block { margin-top: 40px; }

        /* MODERN THEME OVERRIDES */
        #increment-output-container.modern-theme {
            font-family: 'Lato', -apple-system, sans-serif;
            font-size: 10pt;
        }
        .modern-theme .inc-header {
            display: flex; justify-content: space-between; align-items: center;
            text-align: left; border-bottom: 2px solid var(--primary-color); padding-bottom: 15px;
        }
        .modern-theme .inc-header .logo-placeholder { font-size: 1.8em; font-weight: bold; color: var(--primary-color); }
        .modern-theme .inc-header .header-date { text-align: right; font-size: 10pt; color: #555; }
        .modern-theme .inc-subject { font-size: 1.2em; font-weight: 700; }
        .modern-theme .inc-body h3 { color: var(--primary-color); font-size: 1.1em; margin-top: 1.5em; margin-bottom: 0.5em; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .modern-theme .inc-body .compensation-details { background-color: #f8f9fa; padding: 15px; border-radius: 5px; margin-top: 1em; }
    </style>
</head>
<body>

    <div class="overleaf-container">
        <!-- Editor Pane -->
        <div class="editor-pane">
            <form id="incrementForm">
                <h1>Salary Increment Letter</h1>
                <fieldset>
                    <legend>Company & Manager Details</legend>
                    <input type="text" id="companyName" placeholder="Company Name">
                    <input type="text" id="managerName" placeholder="Your Name (Manager/HR)">
                    <input type="text" id="managerTitle" placeholder="Your Title">
                </fieldset>
                <fieldset>
                    <legend>Employee & Review Details</legend>
                    <input type="text" id="employeeName" placeholder="Employee's Full Name">
                    <input type="text" id="reviewPeriod" placeholder="Performance Review Period (e.g., 2023-2024)">
                </fieldset>
                <fieldset>
                    <legend>Performance Rationale</legend>
                    <textarea id="performanceRationale" rows="4" placeholder="Reason for increment (e.g., 'consistent high performance', 'valuable contributions to Project Y')."></textarea>
                </fieldset>
                <fieldset>
                    <legend>Increment Details</legend>
                    <input type="text" id="currentSalary" placeholder="Current Annual Salary / CTC">
                    <input type="text" id="newSalary" placeholder="New Annual Salary / CTC (Required)">
                    <input type="text" id="incrementAmount" placeholder="Increment Amount or Percentage (e.g., 10% or $10,000)">
                    <label for="effectiveDate">Effective Date of Increment</label>
                    <input type="date" id="effectiveDate">
                </fieldset>
                <fieldset>
                    <legend>Generate & Refine</legend>
                    <button type="button" class="ai-button" onclick="generateLetter()">✨ Assemble Letter</button>
                    <textarea id="letterBody" rows="15" placeholder="The assembled letter body will appear here. Review for accuracy and tone." style="margin-top: 15px;"></textarea>
                </fieldset>
            </form>
        </div>

        <!-- Preview Pane -->
        <div class="preview-pane">
            <div class="preview-controls">
                <h2>Live Preview</h2>
                <div class="theme-switch-wrapper">
                    <span>Simple</span>
                    <label class="theme-switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider"></span>
                    </label>
                    <span>Modern</span>
                </div>
                <button type="button" class="download-button" id="downloadPdfBtn">Download PDF</button>
            </div>
            <div id="increment-output-container">
                <p style="text-align: center; color: #888; margin-top: 2in;">Your Increment Letter will appear here.</p>
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div class="loader-overlay" id="loader"><div class="loader"></div></div>

    <!-- Hidden styles for PDF -->
    <style id="inc-styles-for-pdf">
        body { font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 11pt; line-height: 1.5; }
        .inc-header { text-align: center; margin-bottom: 40px; }
        .inc-header .company-name { font-size: 1.6em; font-weight: bold; }
        .inc-recipient-info { margin-top: 20px; margin-bottom: 20px; }
        .inc-subject { font-weight: bold; margin-top: 20px; margin-bottom: 20px; }
        .inc-body p { margin-bottom: 1em; }
        .inc-signature-block { margin-top: 40px; }
        .modern-theme { font-family: 'Lato', -apple-system, sans-serif; font-size: 10pt; }
        .modern-theme .inc-header { display: flex; justify-content: space-between; align-items: center; text-align: left; border-bottom: 2px solid #004085; padding-bottom: 15px; }
        .modern-theme .inc-header .logo-placeholder { font-size: 1.8em; font-weight: bold; color: #004085; }
        .modern-theme .inc-header .header-date { text-align: right; font-size: 10pt; color: #555; }
        .modern-theme .inc-subject { font-size: 1.2em; font-weight: 700; }
        .modern-theme .inc-body h3 { color: #004085; font-size: 1.1em; margin-top: 1.5em; margin-bottom: 0.5em; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .modern-theme .inc-body .compensation-details { background-color: #f8f9fa; padding: 15px; border-left: 3px solid #004085; margin-top: 1em; }
    </style>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="{{ url_for('static', filename='js/download-payment.js') }}"></script>
    <script>
        const loader = document.getElementById('loader');
        const form = document.getElementById('incrementForm');
        const downloadBtn = document.getElementById('downloadPdfBtn');
        const letterBodyTextarea = document.getElementById('letterBody');
        const previewContainer = document.getElementById('increment-output-container');
        const themeToggle = document.getElementById('theme-toggle');

        async function fetchAIContent(prompt) { /* ... (same as previous) ... */ }

        async function generateLetter() {
            const data = {
                employeeName: document.getElementById('employeeName').value,
                reviewPeriod: document.getElementById('reviewPeriod').value,
                performanceRationale: document.getElementById('performanceRationale').value,
                newSalary: document.getElementById('newSalary').value,
                incrementAmount: document.getElementById('incrementAmount').value,
                effectiveDate: document.getElementById('effectiveDate').value,
            };

            if (!data.employeeName || !data.newSalary || !data.effectiveDate) {
                alert("Please fill in Employee Name, New Salary, and Effective Date.");
                return;
            }

            const prompt = `
                You are a senior HR Director. Assemble a formal and motivational salary increment letter.

                **Data:**
                - Employee: ${data.employeeName}
                - Review Period: ${data.reviewPeriod}
                - Rationale for Increment: ${data.performanceRationale}
                - New Annual Salary/CTC: ${data.newSalary}
                - Increment Value (if provided): ${data.incrementAmount || 'N/A'}
                - Effective Date: ${data.effectiveDate}

                **Instructions:**
                1.  **Opening:** Start with a positive opening acknowledging the successful completion of the performance review for the specified period.
                2.  **Acknowledgement:** Write a paragraph recognizing the employee's valuable contributions, using the "Rationale for Increment" as the basis.
                3.  **Increment Details:** Clearly and formally state the new salary. If an increment value is provided, mention it as well. Specify the effective date.
                4.  **Closing:** End with an encouraging statement, expressing confidence in their continued success and positive impact on the company.
                5.  **IMPORTANT:** Generate ONLY the letter body. Do not include salutations, subjects, dates, or signatures.
            `;

            const result = await fetchAIContent(prompt);
            if (result) {
                letterBodyTextarea.value = result;
                updatePreview();
            }
        }

        function updatePreview() {
            const isModern = themeToggle.checked;
            previewContainer.classList.toggle('modern-theme', isModern);

            const data = {
                companyName: document.getElementById('companyName').value,
                managerName: document.getElementById('managerName').value || 'HR Manager',
                managerTitle: document.getElementById('managerTitle').value || 'Human Resources',
                employeeName: document.getElementById('employeeName').value,
                letterBody: letterBodyTextarea.value,
            };

            const today = new Date();
            const dateString = today.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            const bodyWithParagraphs = data.letterBody.split('\n').filter(p => p.trim() !== '').map(p => `<p>${p.trim()}</p>`).join('');

            let html = `
                <div class="inc-header">
                    ${isModern ? `<div class="logo-placeholder">${data.companyName.split(' ')[0] || 'Company'}</div><div class="header-date">Date: ${dateString}</div>` : `<div class="company-name">${data.companyName || 'Company Name'}</div>`}
                </div>
                ${!isModern ? `<div class="inc-date">Date: ${dateString}</div>` : ''}
                <div class="inc-recipient-info">
                    <div><strong>To,</strong></div>
                    <div>${data.employeeName || 'Employee Name'}</div>
                </div>
                <div class="inc-subject">Subject: Salary Increment Letter</div>
                <div class="inc-salutation">Dear ${data.employeeName || 'Employee'},</div>
                <div class="inc-body">${bodyWithParagraphs || '<p>[Letter content will be assembled here...]</p>'}</div>
                <div class="inc-signature-block">
                    <p>Sincerely,</p><br><br>
                    <p>_________________________</p>
                    <p><strong>${data.managerName}</strong></p>
                    <p>${data.managerTitle}</p>
                    <p>${data.companyName}</p>
                </div>
            `;

            previewContainer.innerHTML = html;
        }

        async function downloadPDF() { /* ... (same as previous, with updated filename logic) ... */ }

        // Re-pasting full functions for completeness
        async function fetchAIContent(prompt) {
            loader.style.display = 'flex';
            try {
                const response = await fetch('/generate_ai_content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                if (!response.ok) { const error = await response.json(); throw new Error(error.error || `HTTP error! status: ${response.status}`); }
                const data = await response.json();
                return data.text;
            } catch (error) {
                console.error("Error fetching AI content:", error);
                alert(`AI Generation Failed: ${error.message}`);
                return null;
            } finally {
                loader.style.display = 'none';
            }
        }
        async function downloadPDF() {
            const employeeName = document.getElementById('employeeName').value;
            if (!employeeName || !letterBodyTextarea.value) {
                alert('Please provide the employee\'s name and assemble the letter before downloading.');
                return;
            }
            loader.style.display = 'flex';
            const contentToPrint = previewContainer.innerHTML;
            const styles = document.getElementById('inc-styles-for-pdf').innerHTML;
            const isModern = themeToggle.checked;
            const containerClass = isModern ? 'modern-theme' : '';
            const fullHtmlContent = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Increment Letter</title><link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet"><style>${styles}</style></head><body class="${containerClass}">${contentToPrint}</body></html>`;
            try {
                const response = await fetch('/download_pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ html_content: fullHtmlContent })
                });
                if (!response.ok) throw new Error(`PDF generation failed: ${response.statusText}`);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                const safeName = employeeName.replace(/[^a-z0-9]/gi, '_').replace(/_+/g, '_');
                a.download = `Increment_Letter_for_${safeName || 'employee'}.pdf`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
            } catch (error) {
                console.error('Error downloading PDF:', error);
                alert(error.message || 'Could not download PDF. See console for details.');
            } finally {
                loader.style.display = 'none';
            }
        }

        // --- Event Listeners ---
        form.addEventListener('input', updatePreview);
        themeToggle.addEventListener('change', updatePreview);
        downloadBtn.addEventListener('click', downloadPDF);

        // --- Initial Load ---
        updatePreview();
    </script>
</body>
</html>
