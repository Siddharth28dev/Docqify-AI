 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resignation Letter Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- General & Layout Styles --- */
        :root {
            --primary-color: #6c757d; /* A neutral, professional gray */
            --secondary-color: #343a40;
            --background-color: #f0f2f5;
            --editor-bg: #ffffff;
            --preview-bg: #f8f9fa;
            --border-color: #dee2e6;
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background-color);
        }
        .overleaf-container { display: flex; height: 100vh; }
        .editor-pane, .preview-pane {
            height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        .editor-pane { flex: 1; background-color: var(--editor-bg); border-right: 1px solid var(--border-color); }
        .preview-pane { flex: 1.2; background-color: var(--preview-bg); }
        .preview-controls {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
        }

        /* --- Form Styles --- */
        #resignationForm { max-width: 600px; margin: auto; }
        #resignationForm h1 { color: var(--primary-color); text-align: center; }
        #resignationForm fieldset { border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        #resignationForm legend { font-size: 1.3em; font-weight: 600; color: var(--primary-color); padding: 0 10px; }
        input[type="text"], input[type="date"], textarea {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border-color);
            border-radius: 5px; box-sizing: border-box; font-family: inherit; font-size: 1rem;
        }
        .ai-button, .download-button { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 1em; }
        .ai-button { background-color: #ffc107; color: #333; display: block; width: 100%; margin-top: 10px; }
        .download-button { background-color: #28a745; color: white; }

        /* --- Theme Switch Styles --- */
        .theme-switch-wrapper { display: flex; align-items: center; gap: 10px; }
        .theme-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .theme-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* --- Loader Styles --- */
        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid var(--primary-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- Resignation Letter PREVIEW STYLES --- */
        /* BASE (SIMPLE) THEME */
        #resignation-output-container {
            max-width: 8.5in; min-height: 11in; margin: 0 auto; background: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.1); padding: 1in; box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 12pt; line-height: 1.6;
            transition: all 0.3s ease;
        }
        .res-sender-info, .res-recipient-info { margin-bottom: 30px; line-height: 1.4; }
        .res-date { margin-bottom: 30px; }
        .res-body { margin-top: 20px; text-align: justify; }
        .res-body p { margin-bottom: 1.2em; }
        .res-closing { margin-top: 30px; }

        /* MODERN THEME OVERRIDES */
        #resignation-output-container.modern-theme {
            font-family: 'Lato', -apple-system, sans-serif;
            font-size: 11pt;
        }
        .modern-theme .res-sender-info {
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .modern-theme .res-employee-name {
            font-size: 1.4em;
            font-weight: 700;
            color: #343a40;
        }
        .modern-theme .res-job-title {
            color: #6c757d;
        }
        .modern-theme .res-body p {
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="overleaf-container">
        <!-- Editor Pane -->
        <div class="editor-pane">
            <form id="resignationForm">
                <h1>Resignation Letter Generator</h1>
                <fieldset>
                    <legend>Your Details</legend>
                    <input type="text" id="employeeName" placeholder="Your Full Name">
                    <input type="text" id="jobTitle" placeholder="Your Job Title">
                </fieldset>
                <fieldset>
                    <legend>Company Details</legend>
                    <input type="text" id="managerName" placeholder="Your Manager's Full Name">
                    <input type="text" id="companyName" placeholder="Company Name">
                </fieldset>
                <fieldset>
                    <legend>Resignation Details</legend>
                    <label for="lastDay">Your Last Day of Employment (Required)</label>
                    <input type="date" id="lastDay">
                    <textarea id="positiveExperiences" rows="4" placeholder="Optional: Mention a few positive experiences or things you're grateful for (e.g., 'the opportunity to work on the X project', 'the supportive team environment')."></textarea>
                </fieldset>
                <fieldset>
                    <legend>Generate & Refine</legend>
                    <button type="button" class="ai-button" onclick="generateLetter()">✨ Generate Letter Body</button>
                    <textarea id="letterBody" rows="15" placeholder="The AI-generated letter body will appear here. Review it for tone and accuracy." style="margin-top: 15px;"></textarea>
                </fieldset>
            </form>
        </div>

        <!-- Preview Pane -->
        <div class="preview-pane">
            <div class="preview-controls">
                <h2>Live Preview</h2>
                <div class="theme-switch-wrapper">
                    <span>Simple</span>
                    <label class="theme-switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider"></span>
                    </label>
                    <span>Modern</span>
                </div>
                <button type="button" class="download-button" id="downloadPdfBtn">Download PDF</button>
            </div>
            <div id="resignation-output-container">
                <p style="text-align: center; color: #888; margin-top: 2in;">Your Resignation Letter will appear here.</p>
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div class="loader-overlay" id="loader"><div class="loader"></div></div>

    <!-- Hidden styles for the PDF -->
    <style id="res-styles-for-pdf">
        body { font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 12pt; line-height: 1.6; }
        .res-sender-info, .res-recipient-info { margin-bottom: 30px; line-height: 1.4; }
        .res-date { margin-bottom: 30px; }
        .res-body { margin-top: 20px; text-align: justify; }
        .res-body p { margin-bottom: 1.2em; }
        .res-closing { margin-top: 30px; }
        .modern-theme { font-family: 'Lato', -apple-system, sans-serif; font-size: 11pt; }
        .modern-theme .res-sender-info { border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 25px; }
        .modern-theme .res-employee-name { font-size: 1.4em; font-weight: 700; color: #343a40; }
        .modern-theme .res-job-title { color: #6c757d; }
        .modern-theme .res-body p { text-align: left; }
    </style>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="{{ url_for('static', filename='js/download-payment.js') }}"></script>
    <script>
        const loader = document.getElementById('loader');
        const form = document.getElementById('resignationForm');
        const downloadBtn = document.getElementById('downloadPdfBtn');
        const letterBodyTextarea = document.getElementById('letterBody');
        const previewContainer = document.getElementById('resignation-output-container');
        const themeToggle = document.getElementById('theme-toggle');

        async function fetchAIContent(prompt) { /* ... (same as previous) ... */ }

        async function generateLetter() {
            const data = {
                employeeName: document.getElementById('employeeName').value,
                jobTitle: document.getElementById('jobTitle').value,
                lastDay: document.getElementById('lastDay').value,
                positiveExperiences: document.getElementById('positiveExperiences').value,
            };

            if (!data.employeeName || !data.jobTitle || !data.lastDay) {
                alert("Please fill in Your Name, Job Title, and Last Day of Employment.");
                return;
            }

            const prompt = `
                Generate a professional and respectful resignation letter body. The tone must be positive and constructive, not negative.

                **Data:**
                - Employee: ${data.employeeName}
                - Position: ${data.jobTitle}
                - Effective Last Day: ${data.lastDay}
                - Positive aspects to mention: ${data.positiveExperiences || 'the opportunities for growth and the supportive team.'}

                **Instructions:**
                1.  Create 2-3 concise paragraphs.
                2.  **Paragraph 1 (Required):** State clearly the intention to resign from the specified position and the effective last day. For example: "Please accept this letter as formal notification that I am resigning from my position as [Job Title]... My last day of employment will be [Date]."
                3.  **Paragraph 2 (Optional but Recommended):** Express gratitude for the opportunity. Use the "Positive aspects" provided to make it sound genuine. Include a standard offer to assist with a smooth transition.
                4.  **Paragraph 3 (Closing):** A short, simple closing wishing the company future success.
                5.  **IMPORTANT:** Generate ONLY the letter body. Do not include salutations (Dear...), dates, addresses, or the final closing (Sincerely,).
            `;

            const result = await fetchAIContent(prompt);
            if (result) {
                letterBodyTextarea.value = result;
                updatePreview();
            }
        }

        function updatePreview() {
            const isModern = themeToggle.checked;
            previewContainer.classList.toggle('modern-theme', isModern);

            const data = {
                employeeName: document.getElementById('employeeName').value,
                jobTitle: document.getElementById('jobTitle').value,
                managerName: document.getElementById('managerName').value || 'Hiring Manager',
                companyName: document.getElementById('companyName').value || 'The Company',
                letterBody: letterBodyTextarea.value,
            };

            const today = new Date();
            const dateString = today.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            const bodyWithParagraphs = data.letterBody.split('\n').filter(p => p.trim() !== '').map(p => `<p>${p.trim()}</p>`).join('');

            let html = `
                <div class="res-sender-info">
                    <div class="res-employee-name">${data.employeeName || 'Your Name'}</div>
                    <div class="res-job-title">${data.jobTitle || 'Your Job Title'}</div>
                </div>
                <div class="res-date">${dateString}</div>
                <div class="res-recipient-info">
                    <div>${data.managerName}</div>
                    <div>${data.companyName}</div>
                </div>
                <div class="res-salutation">Dear ${data.managerName},</div>
                <div class="res-body">${bodyWithParagraphs || '<p>[Your letter content will appear here...]</p>'}</div>
                <div class="res-closing">
                    <p>Sincerely,</p><br><br>
                    <p>${data.employeeName || 'Your Name'}</p>
                </div>
            `;

            previewContainer.innerHTML = html;
        }

        async function downloadPDF() { /* ... (same as previous, with updated filename logic) ... */ }

        // Re-pasting full functions for completeness
        async function fetchAIContent(prompt) {
            loader.style.display = 'flex';
            try {
                const response = await fetch('/generate_ai_content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                if (!response.ok) { const error = await response.json(); throw new Error(error.error || `HTTP error! status: ${response.status}`); }
                const data = await response.json();
                return data.text;
            } catch (error) {
                console.error("Error fetching AI content:", error);
                alert(`AI Generation Failed: ${error.message}`);
                return null;
            } finally {
                loader.style.display = 'none';
            }
        }
        async function downloadPDF() {
            const employeeName = document.getElementById('employeeName').value;
            if (!employeeName || !letterBodyTextarea.value) {
                alert('Please provide your name and generate the letter before downloading.');
                return;
            }
            loader.style.display = 'flex';
            const contentToPrint = previewContainer.innerHTML;
            const styles = document.getElementById('res-styles-for-pdf').innerHTML;
            const isModern = themeToggle.checked;
            const containerClass = isModern ? 'modern-theme' : '';
            const fullHtmlContent = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Resignation Letter</title><link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet"><style>${styles}</style></head><body class="${containerClass}">${contentToPrint}</body></html>`;
            try {
                const response = await fetch('/download_pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ html_content: fullHtmlContent })
                });
                if (!response.ok) throw new Error(`PDF generation failed: ${response.statusText}`);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                const safeName = employeeName.replace(/[^a-z0-9]/gi, '_').replace(/_+/g, '_');
                a.download = `Resignation_Letter_${safeName || 'employee'}.pdf`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
            } catch (error) {
                console.error('Error downloading PDF:', error);
                alert(error.message || 'Could not download PDF. See console for details.');
            } finally {
                loader.style.display = 'none';
            }
        }

        // --- Event Listeners ---
        form.addEventListener('input', updatePreview);
        themeToggle.addEventListener('change', updatePreview);
        downloadBtn.addEventListener('click', downloadPDF);

        // --- Initial Load ---
        updatePreview();
    </script>
</body>
</html>
