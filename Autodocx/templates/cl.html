<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cover Letter Builder - Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Georgia&display=swap" rel="stylesheet">
    <style>
        /* --- General & Layout Styles --- */
        :root {
            --primary-color: #005A9C;
            --secondary-color: #333;
            --background-color: #f0f2f5;
            --editor-bg: #ffffff;
            --preview-bg: #fafafa;
            --border-color: #d9d9d9;
            /* Shiny Theme Colors */
            --shiny-accent: #007BFF;
            --shiny-text: #212529;
            --shiny-header-bg: #f8f9fa;
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background-color);
        }
        .overleaf-container { display: flex; height: 100vh; }
        .editor-pane, .preview-pane {
            height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        .editor-pane { flex: 1; background-color: var(--editor-bg); border-right: 1px solid var(--border-color); }
        .preview-pane { flex: 1.2; background-color: var(--preview-bg); }
        .preview-controls {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
        }

        /* --- Form Styles --- */
        #clForm { max-width: 600px; margin: auto; }
        #clForm h1 { color: var(--primary-color); text-align: center; }
        #clForm fieldset { border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        #clForm legend { font-size: 1.3em; font-weight: 600; color: var(--primary-color); padding: 0 10px; }
        input[type="text"], input[type="email"], input[type="tel"], textarea {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border-color);
            border-radius: 5px; box-sizing: border-box;
        }
        .ai-button, .download-button { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 1em; }
        .ai-button { background-color: #ffc107; color: #333; display: block; width: 100%; margin-top: 10px; }
        .download-button { background-color: #28a745; color: white; }

        /* --- Theme Switch Styles --- */
        .theme-switch-wrapper { display: flex; align-items: center; gap: 10px; }
        .theme-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .theme-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* --- Loader Styles --- */
        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid var(--primary-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- COVER LETTER PREVIEW STYLES --- */
        /* BASE (CLASSIC) THEME */
        #cl-output-container {
            max-width: 8.5in; min-height: 11in; margin: 0 auto; background: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.1); padding: 1in; box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 12pt; line-height: 1.5;
            transition: all 0.3s ease;
        }
        .cl-sender-info, .cl-recipient-info { margin-bottom: 30px; }
        .cl-your-name { font-weight: bold; font-size: 1.2em; }
        .cl-date { margin-bottom: 30px; }
        .cl-body { margin-top: 20px; text-align: justify; }
        .cl-body p { margin-bottom: 1em; }
        .cl-closing { margin-top: 30px; }
        .cl-contact-line { line-height: 1.4; }

        /* SHINY THEME OVERRIDES */
        #cl-output-container.shiny-theme {
            font-family: 'Lato', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11pt;
            color: var(--shiny-text);
        }
        .shiny-theme .cl-header {
            background-color: var(--shiny-header-bg);
            padding: 20px;
            margin: -1in -1in 30px -1in;
            text-align: center;
        }
        .shiny-theme .cl-your-name {
            color: var(--shiny-accent);
            font-size: 2.2em;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .shiny-theme .cl-contact-line {
            display: inline-block;
            margin: 0 10px;
        }
        .shiny-theme .cl-sender-info, .shiny-theme .cl-recipient-info { margin-bottom: 20px; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="overleaf-container">
        <!-- Editor Pane -->
        <div class="editor-pane">
            <form id="clForm">
                <h1>Cover Letter Builder</h1>
                <fieldset>
                    <legend>Your Details</legend>
                    <input type="text" id="yourName" placeholder="Your Full Name">
                    <input type="text" id="yourAddress" placeholder="Your City, State ZIP">
                    <input type="email" id="yourEmail" placeholder="Your Email">
                    <input type="tel" id="yourPhone" placeholder="Your Phone Number">
                </fieldset>
                <fieldset>
                    <legend>Company & Role Details</legend>
                    <input type="text" id="hiringManager" placeholder="Hiring Manager Name (or 'Hiring Team')">
                    <input type="text" id="managerTitle" placeholder="Hiring Manager Title">
                    <input type="text" id="companyName" placeholder="Company Name (e.g., Google, Meta)">
                    <input type="text" id="companyAddress" placeholder="Company Address">
                    <input type="text" id="jobTitle" placeholder="Exact Job Title You're Applying For">
                </fieldset>
                <fieldset>
                    <legend>Letter Content</legend>
                    <textarea id="keyStrengths" rows="5" placeholder="Your key strengths & talking points. List 2-3 top achievements or skills relevant to the job. The AI will build paragraphs around these."></textarea>
                    <textarea id="companyInterest" rows="3" placeholder="Why this company? Show you've done your research! Mention a specific project, product, or company value you admire."></textarea>
                    <button type="button" class="ai-button" onclick="generateLetterBody()">✨ Generate Letter Body with AI</button>
                    <textarea id="letterBody" rows="12" placeholder="The AI-generated letter body will appear here. You can edit it manually afterwards." style="margin-top: 15px;"></textarea>
                </fieldset>
            </form>
        </div>

        <!-- Preview Pane -->
        <div class="preview-pane">
            <div class="preview-controls">
                <h2>Live Preview</h2>
                <div class="theme-switch-wrapper">
                    <span>Simple</span>
                    <label class="theme-switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider"></span>
                    </label>
                    <span>Shiny</span>
                </div>
                <button type="button" class="download-button" id="downloadPdfBtn">Download PDF</button>
            </div>
            <div id="cl-output-container">
                <p style="text-align: center; color: #888; margin-top: 2in;">Your cover letter will appear here.</p>
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div class="loader-overlay" id="loader"><div class="loader"></div></div>

    <!-- Hidden styles for the PDF -->
    <style id="cl-styles-for-pdf">
        body { font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 12pt; line-height: 1.5; }
        .cl-sender-info, .cl-recipient-info { margin-bottom: 30px; }
        .cl-your-name { font-weight: bold; font-size: 1.2em; }
        .cl-date { margin-bottom: 30px; }
        .cl-body { margin-top: 20px; text-align: justify; }
        .cl-body p { margin-bottom: 1em; }
        .cl-closing { margin-top: 30px; }
        .cl-contact-line { line-height: 1.4; }
        .cl-salutation { font-weight: normal; }
        .shiny-theme { font-family: 'Lato', -apple-system, sans-serif; font-size: 11pt; color: #212529; }
        .shiny-theme .cl-header { background-color: #f8f9fa; padding: 20px 1in; margin: -1in -1in 30px -1in; text-align: center; }
        .shiny-theme .cl-your-name { color: #007BFF; font-size: 2.2em; font-weight: 700; margin-bottom: 10px; }
        .shiny-theme .cl-contact-line { display: inline-block; margin: 0 10px; }
        .shiny-theme .cl-sender-info, .shiny-theme .cl-recipient-info { margin-bottom: 20px; line-height: 1.6; }
    </style>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="{{ url_for('static', filename='js/download-payment.js') }}"></script>
    <script>
        // --- DOM Element References ---
        const loader = document.getElementById('loader');
        const themeToggle = document.getElementById('theme-toggle');
        const previewContainer = document.getElementById('cl-output-container');
        const form = document.getElementById('clForm');
        const downloadBtn = document.getElementById('downloadPdfBtn');

        // --- Core Functions ---
        async function fetchAIContent(prompt) {
            loader.style.display = 'flex';
            try {
                const response = await fetch('/generate_ai_content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || `HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                return data.text;
            } catch (error) {
                console.error("Error fetching AI content:", error);
                alert(`AI Generation Failed: ${error.message}`);
                return null;
            } finally {
                loader.style.display = 'none';
            }
        }

        async function generateLetterBody() {
            const jobTitle = document.getElementById('jobTitle').value;
            const companyName = document.getElementById('companyName').value;
            const keyStrengths = document.getElementById('keyStrengths').value;
            const companyInterest = document.getElementById('companyInterest').value;

            if (!jobTitle || !companyName || !keyStrengths || !companyInterest) {
                alert("Please fill in all fields in the 'Company & Role' and 'Letter Content' sections before generating.");
                return;
            }
            const prompt = `Write a professional and compelling cover letter body for a candidate applying to a top-tier tech company. Role: ${jobTitle} at ${companyName}. Key Strengths: ${keyStrengths}. Reason for interest: ${companyInterest}. Instructions: Create 3-4 concise paragraphs with a modern, confident tone. Start with a strong opening. Weave in strengths, connecting them to potential impact. Express genuine interest. End with a call to action. IMPORTANT: Do NOT include the salutation, date, or address blocks. Only generate the letter body itself.`;
            const result = await fetchAIContent(prompt);
            if (result) {
                document.getElementById('letterBody').value = result;
                updatePreview();
            }
        }

        function updatePreview() {
            // **FIXED**: This block now correctly gathers data from the form.
            const data = {
                yourName: document.getElementById('yourName').value,
                yourAddress: document.getElementById('yourAddress').value,
                yourEmail: document.getElementById('yourEmail').value,
                yourPhone: document.getElementById('yourPhone').value,
                hiringManager: document.getElementById('hiringManager').value || 'Hiring Team',
                managerTitle: document.getElementById('managerTitle').value,
                companyName: document.getElementById('companyName').value,
                companyAddress: document.getElementById('companyAddress').value,
                letterBody: document.getElementById('letterBody').value,
            };

            const isShiny = themeToggle.checked;
            previewContainer.classList.toggle('shiny-theme', isShiny);

            const today = new Date();
            const dateString = today.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            const bodyWithParagraphs = data.letterBody.split('\n').filter(p => p.trim() !== '').map(p => `<p>${p}</p>`).join('');

            let html = '';
            if (isShiny) {
                html = `
                    <div class="cl-header">
                        <div class="cl-your-name">${data.yourName || 'Your Name'}</div>
                        <div class="cl-contact-info">
                            ${data.yourAddress ? `<span class="cl-contact-line">📍 ${data.yourAddress}</span>` : ''}
                            ${data.yourEmail ? `<span class="cl-contact-line">✉️ ${data.yourEmail}</span>` : ''}
                            ${data.yourPhone ? `<span class="cl-contact-line">📞 ${data.yourPhone}</span>` : ''}
                        </div>
                    </div>
                    <div class="cl-date">${dateString}</div>
                    <div class="cl-recipient-info">
                        <div><strong>${data.hiringManager}</strong></div>
                        <div>${data.managerTitle || 'Hiring Manager'}</div>
                        <div>${data.companyName || 'Company Name'}</div>
                    </div>`;
            } else { // Classic Theme
                html = `
                    <div class="cl-sender-info">
                        <div class="cl-your-name">${data.yourName || 'Your Name'}</div>
                        <div class="cl-contact-line">${data.yourAddress || 'Your Address'}</div>
                        <div class="cl-contact-line">${data.yourEmail || 'Your Email'} | ${data.yourPhone || 'Your Phone'}</div>
                    </div>
                    <div class="cl-date">${dateString}</div>
                    <div class="cl-recipient-info">
                        <div>${data.hiringManager}</div>
                        <div>${data.managerTitle || 'Hiring Manager'}</div>
                        <div>${data.companyName || 'Company Name'}</div>
                        <div>${data.companyAddress || 'Company Address'}</div>
                    </div>`;
            }

            html += `
                <div class="cl-salutation">Dear ${data.hiringManager},</div>
                <div class="cl-body">${bodyWithParagraphs || '<p>[Your letter content will appear here...]</p>'}</div>
                <div class="cl-closing"><p>Sincerely,</p><br><p>${data.yourName || 'Your Name'}</p></div>`;

            previewContainer.innerHTML = html;
        }

        async function downloadPDF() {
            const contentToPrint = previewContainer.innerHTML;
            const isShiny = themeToggle.checked;
            const containerClass = isShiny ? 'shiny-theme' : '';
            if (!contentToPrint || document.getElementById('yourName').value === '') {
                alert('Please fill out the form before downloading.');
                return;
            }
            loader.style.display = 'flex';
            const styles = document.getElementById('cl-styles-for-pdf').innerHTML;
            const fullHtmlContent = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Cover Letter</title><link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Georgia&display=swap" rel="stylesheet"><style>${styles}</style></head><body class="${containerClass}">${contentToPrint}</body></html>`;
            try {
                const response = await fetch('/download_pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ html_content: fullHtmlContent })
                });
                if (!response.ok) throw new Error(`PDF generation failed: ${response.statusText}`);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'cover_letter.pdf';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
            } catch (error) {
                console.error('Error downloading PDF:', error);
                alert(error.message || 'Could not download PDF. See console for details.');
            } finally {
                loader.style.display = 'none';
            }
        }

        // --- Event Listeners ---
        form.addEventListener('input', updatePreview);
        themeToggle.addEventListener('change', updatePreview);
        downloadBtn.addEventListener('click', downloadPDF);

        // --- Initial Load ---
        updatePreview();
    </script>
</body>
</html>
