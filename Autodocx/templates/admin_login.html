<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        :root {
            --bg-1: #0b1020;
            --bg-2: #161f3a;
            --accent: #39d0ff;
            --accent-2: #6dffb0;
            --text: #f1f5ff;
            --muted: #9fb1d1;
            --danger: #ff6b7a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 20%, rgba(57, 208, 255, 0.22), transparent 32%),
                radial-gradient(circle at 90% 80%, rgba(109, 255, 176, 0.18), transparent 30%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
        }

        .card {
            width: min(92vw, 420px);
            padding: 28px;
            border-radius: 18px;
            background: rgba(17, 24, 44, 0.85);
            border: 1px solid rgba(159, 177, 209, 0.25);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.5rem;
            letter-spacing: 0.02em;
        }

        p {
            margin: 0 0 22px;
            color: var(--muted);
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            border: 1px solid rgba(159, 177, 209, 0.35);
            border-radius: 10px;
            padding: 12px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.04);
            margin-bottom: 14px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            color: #001020;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            cursor: pointer;
        }

        .error {
            margin-top: 12px;
            color: var(--danger);
            font-size: 0.95rem;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <form class="card" method="post" action="/admin/login">
        <h1>Smart Admin Login</h1>
        <p>Sign in to view analytics, download trends, and AI model settings.</p>

        <label for="email">Admin Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>

        <label for="password">Admin Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Login</button>
        <div class="error">{{ message }}</div>
    </form>
</body>
</html>
