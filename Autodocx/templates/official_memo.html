<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Official Memo Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #37474F;
            --secondary-color: #333;
            --background-color: #f0f2f5;
            --editor-bg: #ffffff;
            --preview-bg: #fafafa;
            --border-color: #d9d9d9;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: var(--background-color); }
        .overleaf-container { display: flex; height: 100vh; }
        .editor-pane, .preview-pane { height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .editor-pane { flex: 1; background-color: var(--editor-bg); border-right: 1px solid var(--border-color); }
        .preview-pane { flex: 1.2; background-color: var(--preview-bg); }
        .preview-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        #memoForm { max-width: 600px; margin: auto; }
        #memoForm h1 { color: var(--primary-color); text-align: center; }
        #memoForm fieldset { border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        #memoForm legend { font-size: 1.3em; font-weight: 600; color: var(--primary-color); padding: 0 10px; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border-color); border-radius: 5px; box-sizing: border-box; font-family: inherit; font-size: 1rem; }
        .ai-button, .download-button { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 1em; }
        .ai-button { background-color: #ffc107; color: #333; display: block; width: 100%; margin-top: 10px; }
        .download-button { background-color: #28a745; color: white; }
        .theme-switch-wrapper { display: flex; align-items: center; gap: 10px; }
        .theme-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .theme-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(24px); }
        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid var(--primary-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #memo-output-container {
            max-width: 8.5in; min-height: 11in; margin: 0 auto; background: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.1); padding: 1in; box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 12pt; line-height: 1.6;
            transition: all 0.3s ease;
        }
        .memo-header { text-align: center; border-bottom: 3px double #37474F; padding-bottom: 15px; margin-bottom: 25px; }
        .memo-header h2 { margin: 0; text-transform: uppercase; letter-spacing: 2px; color: #37474F; }
        .memo-header .org-name { font-size: 1.2em; font-weight: bold; margin-bottom: 5px; }
        .memo-fields { margin-bottom: 25px; border-bottom: 1px solid #ccc; padding-bottom: 15px; }
        .memo-field { display: flex; margin-bottom: 8px; }
        .memo-field .label { font-weight: bold; min-width: 100px; }
        .memo-body { text-align: justify; }
        .memo-body p { margin-bottom: 1em; }
        .memo-closing { margin-top: 40px; }

        #memo-output-container.modern-theme { font-family: 'Lato', -apple-system, sans-serif; }
        .modern-theme .memo-header { border-bottom: 3px solid #37474F; }
        .modern-theme .memo-header h2 { letter-spacing: 4px; }
        .modern-theme .memo-fields { background: #f5f5f5; padding: 15px; border-radius: 5px; border: none; }
        .modern-theme .memo-body p { text-align: left; }
    </style>
</head>
<body>
    <div class="overleaf-container">
        <div class="editor-pane">
            <form id="memoForm">
                <h1>Official Memo Generator</h1>
                <fieldset>
                    <legend>1. Organization Details</legend>
                    <input type="text" id="orgName" placeholder="Organization/Department Name">
                    <input type="text" id="memoNumber" placeholder="Memo/Reference Number (e.g., MEMO/2025/001)">
                </fieldset>
                <fieldset>
                    <legend>2. From & To</legend>
                    <input type="text" id="fromName" placeholder="From: Name & Designation">
                    <input type="text" id="fromDept" placeholder="From: Department/Section">
                    <input type="text" id="toName" placeholder="To: Name & Designation">
                    <input type="text" id="toDept" placeholder="To: Department/Section">
                </fieldset>
                <fieldset>
                    <legend>3. Memo Content</legend>
                    <input type="text" id="memoSubject" placeholder="Subject of the Memo">
                    <select id="memoType">
                        <option value="Information">Information / Notification</option>
                        <option value="Directive">Directive / Instruction</option>
                        <option value="Request">Request</option>
                        <option value="Policy Update">Policy Update</option>
                        <option value="Meeting Notice">Meeting Notice</option>
                        <option value="Circular">Circular</option>
                    </select>
                    <select id="urgency">
                        <option value="Normal">Normal</option>
                        <option value="Urgent">Urgent</option>
                        <option value="Immediate">Immediate</option>
                        <option value="Confidential">Confidential</option>
                    </select>
                    <textarea id="memoDetails" rows="5" placeholder="Key points or details to include in the memo..."></textarea>
                    <textarea id="actionRequired" rows="3" placeholder="What action is required from the recipient?"></textarea>
                </fieldset>
                <fieldset>
                    <legend>4. Generate & Refine</legend>
                    <button type="button" class="ai-button" onclick="generateMemo()">✨ Generate Official Memo</button>
                    <textarea id="memoBody" rows="15" placeholder="The AI-generated memo will appear here." style="margin-top: 15px;"></textarea>
                </fieldset>
            </form>
        </div>
        <div class="preview-pane">
            <div class="preview-controls">
                <h2>Live Preview</h2>
                <div class="theme-switch-wrapper">
                    <span>Classic</span>
                    <label class="theme-switch"><input type="checkbox" id="theme-toggle"><span class="slider"></span></label>
                    <span>Modern</span>
                </div>
                <button type="button" class="download-button" id="downloadPdfBtn">Download PDF</button>
            </div>
            <div id="memo-output-container">
                <p style="text-align: center; color: #888; margin-top: 2in;">Your Official Memo will appear here.</p>
            </div>
        </div>
    </div>
    <div class="loader-overlay" id="loader"><div class="loader"></div></div>
    <style id="memo-styles-for-pdf">
        body { font-family: 'Georgia', 'Times New Roman', Times, serif; color: #333; font-size: 12pt; line-height: 1.6; }
        .memo-header { text-align: center; border-bottom: 3px double #37474F; padding-bottom: 15px; margin-bottom: 25px; }
        .memo-header h2 { margin: 0; text-transform: uppercase; letter-spacing: 2px; color: #37474F; }
        .memo-header .org-name { font-size: 1.2em; font-weight: bold; margin-bottom: 5px; }
        .memo-fields { margin-bottom: 25px; border-bottom: 1px solid #ccc; padding-bottom: 15px; }
        .memo-field { display: flex; margin-bottom: 8px; }
        .memo-field .label { font-weight: bold; min-width: 100px; }
        .memo-body { text-align: justify; }
        .memo-body p { margin-bottom: 1em; }
        .memo-closing { margin-top: 40px; }
        .modern-theme { font-family: 'Lato', -apple-system, sans-serif; }
        .modern-theme .memo-header { border-bottom: 3px solid #37474F; }
        .modern-theme .memo-fields { background: #f5f5f5; padding: 15px; border-radius: 5px; border: none; }
    </style>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="{{ url_for('static', filename='js/download-payment.js') }}"></script>
    <script>
        const loader = document.getElementById('loader');
        const form = document.getElementById('memoForm');
        const downloadBtn = document.getElementById('downloadPdfBtn');
        const memoBodyTextarea = document.getElementById('memoBody');
        const previewContainer = document.getElementById('memo-output-container');
        const themeToggle = document.getElementById('theme-toggle');

        async function fetchAIContent(prompt) {
            loader.style.display = 'flex';
            try {
                const response = await fetch('/generate_ai_content', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
                if (!response.ok) { const error = await response.json(); throw new Error(error.error || `HTTP error! status: ${response.status}`); }
                const data = await response.json(); return data.text;
            } catch (error) { console.error("Error:", error); alert(`AI Generation Failed: ${error.message}`); return null; }
            finally { loader.style.display = 'none'; }
        }

        async function generateMemo() {
            const data = {
                orgName: document.getElementById('orgName').value,
                fromName: document.getElementById('fromName').value,
                toName: document.getElementById('toName').value,
                memoSubject: document.getElementById('memoSubject').value,
                memoType: document.getElementById('memoType').value,
                urgency: document.getElementById('urgency').value,
                memoDetails: document.getElementById('memoDetails').value,
                actionRequired: document.getElementById('actionRequired').value,
            };
            if (!data.memoSubject || !data.memoDetails) {
                alert("Please fill in the Subject and Memo Details."); return;
            }
            const prompt = `Write a formal official government/office memo body. Organization: ${data.orgName || 'Government Office'}. From: ${data.fromName}. To: ${data.toName}. Subject: ${data.memoSubject}. Type: ${data.memoType}. Urgency: ${data.urgency}. Details: ${data.memoDetails}. Action required: ${data.actionRequired || 'For information and necessary action'}. Instructions: Write 2-4 concise, formal paragraphs. The tone should be authoritative and official. Use bureaucratic language appropriate for government communications. Include reference to the subject matter, key details, and clearly state what action is expected. Generate ONLY the memo body content - no header fields, date, or signature blocks.`;
            const result = await fetchAIContent(prompt);
            if (result) { memoBodyTextarea.value = result; updatePreview(); }
        }

        function updatePreview() {
            const isModern = themeToggle.checked;
            previewContainer.classList.toggle('modern-theme', isModern);
            const data = {
                orgName: document.getElementById('orgName').value || 'Organization Name',
                memoNumber: document.getElementById('memoNumber').value || 'MEMO/____/___',
                fromName: document.getElementById('fromName').value || 'Sender Name & Designation',
                fromDept: document.getElementById('fromDept').value || '',
                toName: document.getElementById('toName').value || 'Recipient Name & Designation',
                toDept: document.getElementById('toDept').value || '',
                memoSubject: document.getElementById('memoSubject').value || 'Subject',
                urgency: document.getElementById('urgency').value,
                memoBody: memoBodyTextarea.value,
            };
            const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            const bodyHtml = data.memoBody.split('\n').filter(p => p.trim()).map(p => `<p>${p.trim()}</p>`).join('');
            const urgencyBadge = data.urgency !== 'Normal' ? `<div style="color: red; font-weight: bold; text-align: right; margin-bottom: 10px;">[${data.urgency.toUpperCase()}]</div>` : '';
            previewContainer.innerHTML = `
                <div class="memo-header"><div class="org-name">${data.orgName}</div><h2>OFFICE MEMORANDUM</h2></div>
                ${urgencyBadge}
                <div class="memo-fields">
                    <div class="memo-field"><span class="label">No.:</span> <span>${data.memoNumber}</span></div>
                    <div class="memo-field"><span class="label">Date:</span> <span>${today}</span></div>
                    <div class="memo-field"><span class="label">From:</span> <span>${data.fromName}${data.fromDept ? ', ' + data.fromDept : ''}</span></div>
                    <div class="memo-field"><span class="label">To:</span> <span>${data.toName}${data.toDept ? ', ' + data.toDept : ''}</span></div>
                    <div class="memo-field"><span class="label">Subject:</span> <span><strong>${data.memoSubject}</strong></span></div>
                </div>
                <div class="memo-body">${bodyHtml || '<p>[Memo content will appear here...]</p>'}</div>
                <div class="memo-closing"><p>${data.fromName}</p></div>`;
        }

        async function downloadPDF() {
            const subject = document.getElementById('memoSubject').value;
            if (!subject || !memoBodyTextarea.value) { alert('Please provide a subject and generate the memo first.'); return; }
            loader.style.display = 'flex';
            const styles = document.getElementById('memo-styles-for-pdf').innerHTML;
            const containerClass = themeToggle.checked ? 'modern-theme' : '';
            const fullHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Official Memo</title><link href="https://fonts.googleapis.com/css2?family=Georgia&family=Lato:wght@400;700&display=swap" rel="stylesheet"><style>${styles}</style></head><body class="${containerClass}">${previewContainer.innerHTML}</body></html>`;
            try {
                const response = await fetch('/download_pdf', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ html_content: fullHtml }) });
                if (!response.ok) throw new Error('PDF generation failed');
                const blob = await response.blob(); const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); a.style.display = 'none'; a.href = url;
                a.download = `Official_Memo_${subject.replace(/[^a-z0-9]/gi, '_').substring(0, 30)}.pdf`;
                document.body.appendChild(a); a.click(); window.URL.revokeObjectURL(url); a.remove();
            } catch (e) { console.error(e); alert(e.message || 'Could not download PDF.'); }
            finally { loader.style.display = 'none'; }
        }

        form.addEventListener('input', updatePreview);
        themeToggle.addEventListener('change', updatePreview);
        downloadBtn.addEventListener('click', downloadPDF);
        updatePreview();
    </script>
</body>
</html>
